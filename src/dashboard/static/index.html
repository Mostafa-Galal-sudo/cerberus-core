<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CERBERUS · SOC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ───────── Tokens ───────── */
    :root{--bg:#0b0d0f;--side:#0e1114;--panel:#12161a;--panel2:#171c21;--hover:#1c2228;--line:#222a31;--line2:#2e3841;--text:#e8eaec;--soft:#aab2b9;--muted:#76808a;--accent:#ef461b;--accent2:#ff5a2d;--accent-soft:rgba(239,70,27,.14);--green:#2fbf71;--amber:#e5a23a;--red:#f04438;--blue:#5fa8e0;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--head:"Barlow Semi Condensed","Barlow",sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{background:var(--bg);color:var(--text);font:14px/1.45 "Barlow",-apple-system,"Segoe UI",sans-serif;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
    button{font:inherit;color:inherit}
    code{font:11.5px var(--mono);color:#e0c4ba;background:rgba(255,255,255,.04);padding:1px 5px;border-radius:3px}

    /* ───────── Sidebar ───────── */
    .sidebar{width:216px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 14px;gap:16px}
    .brand{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 14px;border-bottom:1px solid var(--line);font:600 12px var(--mono);letter-spacing:.26em}
    .brand-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(47,191,113,.16)}
    .cta-split{display:grid;grid-template-columns:1fr 34px;gap:1px}
    .cta-btn{background:var(--accent);color:#fff;border:0;height:34px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
    .cta-btn:first-child{border-radius:4px 0 0 4px}.cta-btn:last-child{border-radius:0 4px 4px 0;font-size:16px}.cta-btn:hover{background:var(--accent2)}
    .nav{display:flex;flex-direction:column;gap:2px;flex:1}
    .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;color:var(--muted);background:transparent;border:0;border-left:2px solid transparent;cursor:pointer;font-size:12.5px;font-weight:500;text-align:left;transition:.12s}
    .nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.8}
    .nav-item:hover{color:var(--soft);background:var(--panel)}
    .nav-item.active{color:var(--text);background:var(--panel2);border-left-color:var(--accent)}
    .nav-item.active svg{color:var(--accent);opacity:1}
    .nav-badge{margin-left:auto;font:600 10px var(--mono);padding:1px 6px;border-radius:3px;background:var(--accent-soft);color:#ff8a66}
    .sidebar-foot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
    .llm-row{display:flex;gap:6px;flex-wrap:wrap}
    .llm-chip{font:10px var(--mono);padding:2px 7px;border-radius:3px;border:1px solid var(--line2);background:var(--panel);color:var(--muted)}
    .llm-chip.live{border-color:rgba(47,191,113,.45);color:#7ee0a8}
    .user-card{display:flex;align-items:center;gap:10px;padding:6px;border-radius:5px;background:var(--panel)}
    .avatar{width:28px;height:28px;border-radius:5px;background:var(--accent);display:grid;place-items:center;font:700 11px var(--mono)}
    .user-meta strong{display:block;font-size:12px}.user-meta span{font-size:11px;color:var(--muted)}

    /* ───────── Layout / headers ───────── */
    .main{flex:1;min-width:0;overflow-y:auto;padding:24px 28px 32px;display:flex;flex-direction:column;gap:16px}
    .main::-webkit-scrollbar{width:8px}.main::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
    .topbar,.command-intro{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .crumb,.command-eyebrow{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:6px}
    .command-eyebrow{color:var(--accent)}
    .page-title,.command-title{font-size:22px;font-weight:600;letter-spacing:-.02em}
    .command-title span{color:var(--muted);font-weight:400}
    .command-copy{color:var(--muted);font-size:12.5px;margin-top:2px}
    .command-status{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);font:500 10px var(--mono);letter-spacing:.06em;color:var(--soft)}
    .command-status small{color:var(--muted)}
    .command-status i,.stream-indicator i,.command-eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
    .top-actions{display:flex;gap:8px}

    /* ───────── Controls ───────── */
    .btn-ghost,.select-dark,.input-dark{background:var(--panel);color:var(--soft);border:1px solid var(--line2);border-radius:4px;padding:6px 11px;font-size:12px;cursor:pointer;transition:.12s}
    .btn-ghost:hover{background:var(--hover);color:var(--text)}
    .btn-ghost.active{background:var(--accent-soft);border-color:rgba(239,70,27,.45);color:#ff9d80}
    .btn-danger{background:rgba(240,68,56,.12);color:#ff8a80;border:1px solid rgba(240,68,56,.4);border-radius:4px;padding:5px 10px;font-size:11.5px;cursor:pointer}
    .btn-danger:hover{background:rgba(240,68,56,.22)}
    .input-dark{cursor:text;min-width:280px}
    .input-dark:focus,.select-dark:focus{outline:none;border-color:var(--accent)}
    .filter-bar{display:flex;gap:8px}
    button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

    /* ───────── Cards / KPIs ───────── */
    .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
    .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
    .card-title{font-size:14px;font-weight:600}.card-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
    .panel-index{font:600 9.5px var(--mono);letter-spacing:.14em;color:var(--accent);margin-bottom:4px}
    .kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .kpi-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
    .kpi-head{display:flex;justify-content:space-between;font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .kpi-delta{color:var(--soft)}
    .kpi-body{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;gap:8px}
    .kpi-num{font:500 28px/1 var(--mono);letter-spacing:-.04em}
    .kpi-sub{margin-top:6px;font-size:11px;color:var(--muted)}
    .kpi-body svg{flex-shrink:0;max-width:46%;height:auto}

    /* ───────── Floor plan ───────── */
    .plan-legend{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--soft)}
    .plan-legend span{display:flex;align-items:center;gap:6px}
    .plan-legend i{width:10px;height:10px;border-radius:50%;border:2px solid var(--green);background:rgba(47,191,113,.16)}
    .plan-legend i.alert{border-color:var(--accent);background:var(--accent)}.plan-legend i.iso{border-color:var(--red);background:var(--red)}
    .plan-stage{border:1px solid var(--line);border-radius:2px;background:#0a0d0f}
    .plan-stage svg{display:block;width:100%;height:auto}
    .fp-fill{fill:#101418;stroke:#4a555e;stroke-width:3}
    .z-office .fp-fill{fill:#11171c}.z-it .fp-fill{fill:#0f1a20}.z-util .fp-fill{fill:#181510}.z-store .fp-fill{fill:#12151a}
    .z-prod .fp-fill{fill:url(#fpHatch)}.z-out .fp-fill{fill:url(#fpHatchO);stroke-dasharray:7 4}
    .fp-room.alert .fp-fill{stroke:var(--accent);stroke-width:3.5;stroke-dasharray:none}.fp-room.iso .fp-fill{stroke:var(--red);stroke-width:3.5;stroke-dasharray:none}
    .fp-label{font:600 12px var(--head);letter-spacing:.09em;fill:#8d98a1}.fp-count{font:500 11px var(--mono);fill:#aab2b9}
    .fp-prop{fill:none;stroke:#2f3a42;stroke-width:1.2}.fp-prop-f{fill:#171d23;stroke:#2f3a42;stroke-width:1}
    .fp-gap{stroke:#0a0d0f;stroke-width:6}.fp-swing{fill:none;stroke:#56626c;stroke-width:1.1}
    .fp-corr{stroke:#26303a;stroke-width:1.2;stroke-dasharray:10 6}.fp-corr-t{font:500 11px var(--head);letter-spacing:.5em;fill:#46525c;text-anchor:middle}
    .fp-dev{cursor:pointer}
    .fp-mk{fill:rgba(47,191,113,.16);stroke:var(--green);stroke-width:1.7;stroke-linejoin:round}
    .fp-dev.alert .fp-mk{fill:rgba(239,70,27,.38);stroke:var(--accent);stroke-width:2.1}
    .fp-dev.iso .fp-mk{fill:rgba(240,68,56,.5);stroke:var(--red);stroke-dasharray:2.5 2}
    .fp-ring{fill:none;stroke:transparent;transform-box:fill-box;transform-origin:center}
    .fp-dev.alert .fp-ring{stroke:var(--accent);animation:ring 1.8s ease-out infinite}
    .fp-dev:hover .fp-mk{stroke-width:2.8;filter:brightness(1.5)}
    .fp-tip{position:fixed;z-index:50;display:none;pointer-events:none;background:#0b0e11;border:1px solid var(--line2);border-radius:2px;padding:10px 12px;min-width:210px;font-size:13px;box-shadow:0 10px 28px rgba(0,0,0,.55)}
    .fp-tip b{display:block;font:500 12.5px var(--mono);margin-bottom:6px}
    .fp-tip div{display:flex;justify-content:space-between;gap:16px;color:var(--muted);padding:1px 0}.fp-tip div span{color:var(--text)}
    .fp-tip .dev-tip-head{display:flex;justify-content:flex-start;align-items:center;gap:7px;margin-bottom:6px}.fp-tip .dev-tip-head b{margin-bottom:0}
    .fp-tip .dev-tip-head .dev-ico{color:var(--muted)}
    .dev-ico{width:15px;height:15px;flex-shrink:0;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .dev-ico.lg{width:19px;height:19px;vertical-align:-4px}
    .dev-cell{display:flex;align-items:center;gap:7px;color:var(--text)}
    .dev-cell .dev-ico{color:var(--muted)}
    .room-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border:1px solid var(--line2);border-radius:2px;background:var(--panel2);color:var(--soft);font:500 11px var(--mono);white-space:nowrap}
    .room-badge svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .room-roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:8px;max-height:190px;overflow:auto;padding:10px 12px;border-top:1px solid var(--line)}
    .roster-room{border:1px solid var(--line);border-radius:2px;padding:8px 9px;background:var(--panel2)}
    .roster-room>strong{display:block;font:600 11px var(--head);letter-spacing:.06em;color:var(--soft);margin-bottom:6px}
    .roster-dev{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--soft);padding:2px 0}
    .roster-dev .dev-ico{width:13px;height:13px;color:var(--muted)}
    .fp-dev .fp-ico path,.fp-dev .fp-ico circle,.fp-dev .fp-ico rect{fill:none;stroke:var(--green);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .fp-dev.alert .fp-ico path,.fp-dev.alert .fp-ico circle,.fp-dev.alert .fp-ico rect{stroke:var(--accent)}
    .fp-dev.iso .fp-ico path,.fp-dev.iso .fp-ico circle,.fp-dev.iso .fp-ico rect{stroke:var(--red)}
    @keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2)}}
    @keyframes blink{50%{opacity:.35}}

    /* ───────── Feed / priority queue ───────── */
    .lower-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:12px}
    .feed,.incident-highlights{display:flex;flex-direction:column}
    .feed-item,.highlight-item{display:flex;align-items:center;gap:12px;padding:10px 4px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%;transition:.12s}
    .feed-item:hover,.highlight-item:hover{background:var(--panel2)}
    .feed-ico{width:26px;height:26px;border-radius:4px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font:600 12px var(--mono);color:var(--muted);flex-shrink:0}
    .feed-ico.crit{color:#ff8a66;background:var(--accent-soft);border-color:rgba(239,70,27,.35)}
    .feed-main,.highlight-copy{flex:1;min-width:0}.feed-main strong,.highlight-copy strong{display:block;font-size:12.5px;font-weight:500}
    .feed-main span{font-size:11px;color:var(--muted)}
    .feed-arrow,.highlight-arrow{color:var(--muted)}
    .text-link{background:none;border:0;color:#ff8a66;font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
    .severity-mark{width:3px;height:30px;border-radius:2px;background:var(--sev,var(--red))}
    .highlight-copy small,.highlight-meta small{font:10px var(--mono);color:var(--muted)}
    .highlight-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
    .severity-label{font:600 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
    .severity-label.high{color:var(--accent)}.severity-label.medium{color:var(--amber)}.severity-label.low{color:var(--green)}
    .empty-feed{display:flex;flex-direction:column;align-items:center;gap:4px;padding:34px 0;color:var(--muted);font-size:12px}
    .empty-feed strong{color:var(--soft)}.empty-feed-mark{font-size:22px}

    /* ───────── Tables / pills ───────── */
    .table-wrap{border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:auto}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;padding:10px 14px;font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--panel2);border-bottom:1px solid var(--line)}
    td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--soft)}
    tr:last-child td{border-bottom:0}td strong{color:var(--text);font-weight:600}
    tr.click-row{cursor:pointer}tr.click-row:hover td{background:var(--panel2)}
    .sev-critical{--sev:#ff3b30}.sev-high{--sev:var(--accent)}.sev-medium{--sev:var(--amber)}.sev-low{--sev:var(--green)}
    .sev-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sev,var(--muted));margin-right:6px}
    .pill-status{--c:var(--soft);display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:3px;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
    .pill-status .sev-dot{margin:0}
    .pill-status.open{--c:var(--accent)}.pill-status.investigating{--c:var(--amber)}.pill-status.mitigated{--c:var(--blue)}
    .pill-status.resolved,.pill-status.ALLOW,.pill-status.online,.pill-status.healthy,.pill-status.normal,.pill-status.ok{--c:var(--green)}
    .pill-status.isolated,.pill-status.DENY,.pill-status.active{--c:var(--red)}
    .pill-status[class*="sev-"]{--c:var(--sev)}

    /* ───────── Kanban ───────── */
    .kanban{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;align-items:start}
    .k-col{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
    .k-col-head{display:flex;align-items:center;padding:2px 4px 8px;border-bottom:1px solid var(--line);font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
    .k-card{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--sev,var(--line2));border-radius:4px;padding:10px 12px;cursor:pointer;transition:.12s}
    .k-card:hover{background:var(--hover);border-color:var(--line2);border-left-color:var(--sev)}
    .k-top,.k-foot{display:flex;justify-content:space-between;align-items:center}
    .k-id{font:600 11px var(--mono);display:flex;align-items:center}
    .k-asset{margin:6px 0 8px;font-size:12px;color:var(--soft)}
    .k-foot{font:10.5px var(--mono);color:var(--muted)}
    .assignee{width:20px;height:20px;border-radius:4px;background:var(--accent-soft);color:#ff8a66;display:grid;place-items:center;font:600 9px var(--mono)}

    /* ───────── Incident detail ───────── */
    .inc-banner{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px 0}
    .inc-banner-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:14px}
    .inc-meta{display:flex;gap:28px}
    .inc-meta label{display:block;font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
    .subtabs{display:flex;gap:4px;border-top:1px solid var(--line)}
    .subtab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer}
    .subtab:hover{color:var(--soft)}.subtab.active{color:var(--text);border-bottom-color:var(--accent)}
    .inc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .kv-list{display:flex;flex-direction:column}
    .kv-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
    .kv-row:last-child{border:0}.kv-row>span:first-child{color:var(--muted)}
    .tl-list{display:flex;flex-direction:column;gap:10px}
    .tl-card{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;padding:11px 14px;font-size:12.5px}
    .tl-card pre{margin-top:8px;padding:10px;background:#0b0e11;border:1px solid var(--line);border-radius:4px;font:11px/1.5 var(--mono);color:var(--soft);overflow:auto}
    .empty-sphere{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 0;text-align:center}

    /* ───────── Industrial refinement ───────── */
    .panel-index{display:none}
    .card,.kpi-card,.k-col,.table-wrap,.inc-banner,.k-card,.tl-card,.command-status,.btn-ghost,.select-dark,.input-dark,.btn-danger,.cta-btn,.cta-btn:first-child,.cta-btn:last-child,.nav-item,.nav-badge,.llm-chip,.avatar,.user-card,.feed-ico,.assignee,.pill-status,code{border-radius:2px}
    .page-title,.command-title{font:600 28px var(--head);letter-spacing:0}
    .command-title span{font-weight:500}
    .card-title{font:600 17px var(--head)}
    .crumb,.command-eyebrow{font:500 13px var(--head);letter-spacing:.02em;text-transform:none;color:var(--muted)}
    .command-eyebrow{color:var(--accent)}
    .command-eyebrow i,.command-status i,.stream-indicator i{animation:none}
    .command-status{font:500 12px var(--head);letter-spacing:.06em}
    th{font:600 12px var(--head);letter-spacing:.07em}
    td,.kv-row,.tl-card{font-size:13.5px}
    .kpi-head{font:500 12.5px var(--head);letter-spacing:.05em}
    .kpi-num{font:600 38px/1 var(--head);letter-spacing:-.01em}
    .kpi-card{border-top:2px solid var(--line2)}.kpi-card:nth-child(2){border-top-color:var(--accent)}
    .pill-status{font:600 11.5px var(--head);letter-spacing:.07em}
    .k-id,.k-foot,.highlight-copy small,.highlight-meta small{font-family:var(--mono);font-size:11px}
    .tl-card pre{font-family:var(--mono)}
    .sidebar{background:#0a0c0e}.brand{font:700 16px var(--head);letter-spacing:.34em}
    .nav-item{font-size:14px}.nav-item.active{background:transparent;border-left-width:3px}
    .text-link,.subtab,.k-col-head,.severity-label{font-family:var(--head);font-size:12.5px;letter-spacing:.07em}
    .inc-meta label{font:500 12px var(--head);letter-spacing:.07em}

    /* ───────── Sidebar v2 ───────── */
    .sidebar{width:236px;padding:0;gap:0;background:#090b0d}
    .brand{justify-content:flex-start;gap:12px;padding:20px 18px 18px;letter-spacing:0}
    .brand .logo{width:30px;height:30px;color:var(--accent);flex-shrink:0}
    .brand b{display:block;font:700 17px var(--head);letter-spacing:.28em}
    .brand small{display:block;font:500 11.5px var(--head);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
    .side-live{display:flex;align-items:center;gap:9px;margin:14px 14px 6px;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:2px;font:500 12.5px var(--head);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
    .side-live button{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px}.side-live button:hover{color:var(--accent)}
    .nav{padding:6px 0;gap:0}
    .nav-sec{padding:16px 18px 6px;font:600 11px var(--head);letter-spacing:.18em;text-transform:uppercase;color:#4d5862}
    .nav-item{height:38px;padding:0 18px;border-radius:0;border-left:3px solid transparent;font:500 14.5px var(--head);letter-spacing:.02em}
    .nav-item.active{background:linear-gradient(90deg,rgba(239,70,27,.15),transparent);border-left-color:var(--accent)}
    .nav-badge{font:600 12px var(--head);background:var(--accent);color:#fff;padding:0 7px;min-width:20px;text-align:center}
    .sidebar-foot{padding:14px 16px;gap:12px}
    .llm-row{flex-direction:column;gap:5px}
    .llm-chip{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;font:500 12px var(--mono);color:var(--muted)}
    .llm-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:#3b444c}
    .llm-chip.live{color:var(--soft)}.llm-chip.live::before{background:var(--green)}

    /* ───────── Inner pages ───────── */
    .topbar{padding-bottom:14px;border-bottom:1px solid var(--line)}
    .stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);background:var(--panel)}
    .stat{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 16px;background:none;border:0;border-left:3px solid var(--sev,var(--line2));border-right:1px solid var(--line);cursor:pointer;color:var(--muted);font:500 12.5px var(--head);letter-spacing:.07em;text-transform:uppercase}
    .stat:last-child{border-right:0}.stat:disabled{cursor:default}
    .stat strong{font:600 30px/1.1 var(--head);color:var(--text);letter-spacing:0}
    .stat:not(:disabled):hover,.stat.act{background:var(--panel2)}.stat.act{color:var(--text)}
    tr.click-row td:first-child{box-shadow:inset 3px 0 0 var(--sev,transparent)}
    .table-wrap td code{color:var(--text)}
    .k-col{border-top:2px solid var(--line2)}
    .inc-banner{border-left:4px solid var(--sev,var(--accent))}
    .filter-bar{padding:10px;background:var(--panel);border:1px solid var(--line)}
    .filter-bar .input-dark{flex:1;max-width:420px}
    .kv-row strong,.kv-row code{font-weight:600}

    .toast{position:fixed;right:24px;bottom:24px;z-index:60;background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--accent);padding:10px 14px;font-size:13.5px;border-radius:2px;opacity:0;transform:translateY(14px);transition:.2s;pointer-events:none}.toast.on{opacity:1;transform:none}

    /* ───────── Responsive (desktop + tablet) ───────── */
    @media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lower-grid,.inc-grid{grid-template-columns:1fr}.main{padding:20px}}
    @media(max-width:820px){body{display:block;overflow:auto}.sidebar{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 14px}.brand{border:0;padding:0}.nav{flex-direction:row;overflow:auto;order:3;width:100%}.nav-item{white-space:nowrap}.sidebar-foot{display:none}.main{overflow:visible}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32"><path d="M16 2 4 8v9c0 7 5 11 12 13 7-2 12-6 12-13V8z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 13h12M10 18h12" stroke="currentColor" stroke-width="2"/></svg>
      <div><b>CERBERUS</b><small>Plant security ops</small></div>
    </div>
    <div class="side-live"><span class="brand-dot" id="sse-dot" title="Live SSE Stream"></span><span id="live-label">Live telemetry</span><button onclick="refreshAll()" title="Refresh feed">&#8635;</button></div>
    <nav class="nav">
      <div class="nav-sec">Monitor</div>
      <button class="nav-item active" data-view="dashboard" onclick="setView('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</button>
      <button class="nav-item" data-view="findings" onclick="setView('findings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>Findings<span class="nav-badge" id="nav-open-badge">0</span></button>
      <button class="nav-item" data-view="incidents" onclick="setView('incidents')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Incidents</button>
      <div class="nav-sec">Fleet &amp; response</div>
      <button class="nav-item" data-view="devices" onclick="setView('devices')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>Devices</button>
      <button class="nav-item" data-view="isolations" onclick="setView('isolations')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>Isolations</button>
      <div class="nav-sec">Governance</div>
      <button class="nav-item" data-view="audit" onclick="setView('audit')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Policy Audit</button>
    </nav>
    <div class="sidebar-foot">
      <div class="llm-row"><span class="llm-chip" id="groq-chip">Groq: --</span><span class="llm-chip" id="ds-chip">DeepSeek: --</span></div>
      <div class="user-card"><div class="avatar">C3</div><div class="user-meta"><strong>SOC Operator</strong><span>@cerberus-lab</span></div></div>
    </div>
  </aside>

  <main class="main" id="main-root"></main>

  <script>
    let currentView = "dashboard";
    let findingsMode = "kanban";
    let selectedIncidentId = null;
    let incidentTab = "overview";
    let filters = { q: "", severity: "" };
    let feedSort = "latest";

    let state = {
      health: { llm_mode: { groq: "fallback", deepseek: "fallback" } },
      kpis: {},
      devices: [],
      incidents: [],
      isolations: [],
      audit: [],
    };

    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function relTime(iso) {
      if (!iso) return "just now";
      const sec = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 1000));
      if (Number.isNaN(sec)) return String(iso).slice(0, 16);
      if (sec < 60) return `${sec}s ago`;
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min}m ago`;
      const hr = Math.floor(min / 60);
      if (hr < 24) return `${hr}h ago`;
      return `${Math.floor(hr / 24)}d ago`;
    }

    function setView(v) {
      currentView = v;
      if (v === "incidents" && !selectedIncidentId && state.incidents.length) {
        selectedIncidentId = state.incidents[0].id;
      }
      document.querySelectorAll(".nav-item[data-view]").forEach((el) => {
        el.classList.toggle("active", el.dataset.view === v);
      });
      render();
    }

    function exportIncidentsCsv() {
      const cols = ["id", "device_id", "severity", "status", "detection_ref", "decision", "outcome", "updated_utc"];
      const lines = [cols.join(",")].concat(
        state.incidents.map((i) => cols.map((c) => `"${String(i[c] ?? "").replace(/"/g, '""')}"`).join(","))
      );
      const blob = new Blob([lines.join("\n")], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "cerberus_findings.csv";
      a.click();
      toast(`Exported ${state.incidents.length} findings`);
    }

    function biWaveformSvg(color = "#22c55e") {
      const vals = [7, 11, 6, 13, 9, 15, 11, 16, 12, 8, 14, 10, 15, 9, 12];
      return `<svg width="106" height="36" viewBox="0 0 106 36">
        <line x1="0" y1="18" x2="106" y2="18" stroke="#2c2624" stroke-width="1"/>
        ${vals.map((v, i) => `<rect x="${i * 7 + 1}" y="${18 - v}" width="3" height="${v * 2}" rx="1.5" fill="${color}" opacity="${0.55 + (i % 3) * 0.15}"/>`).join("")}
      </svg>`;
    }

    function tickedRingSvg(pct = 40, color = "#e68a2e") {
      const r = 16, c = 2 * Math.PI * r;
      const dash = (Math.max(0, Math.min(100, pct)) / 100) * c;
      return `<svg width="46" height="46" viewBox="0 0 46 46">
        <circle cx="23" cy="23" r="20" fill="none" stroke="#302927" stroke-width="2" stroke-dasharray="1.5 3"/>
        <circle cx="23" cy="23" r="${r}" fill="none" stroke="#26211f" stroke-width="3.5"/>
        <circle cx="23" cy="23" r="${r}" fill="none" stroke="${color}" stroke-width="3.5" stroke-dasharray="${dash} ${c}" stroke-linecap="round" transform="rotate(-90 23 23)"/>
        <text x="23" y="26" text-anchor="middle" fill="#f3efed" font-size="9.5" font-weight="600">${Math.round(pct)}%</text>
      </svg>`;
    }

    function tickedArcGaugeSvg(pct = 80) {
      return `<svg width="82" height="42" viewBox="0 0 82 42">
        <path d="M 8 36 A 32 32 0 0 1 74 36" fill="none" stroke="#2e2826" stroke-width="5" stroke-dasharray="2 3"/>
        <path d="M 8 36 A 32 32 0 0 1 74 36" fill="none" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="${(pct / 100) * 101} 101"/>
      </svg>`;
    }

    function wireframeSphereSvg() {
      return `<svg width="170" height="170" viewBox="0 0 180 180">
        <defs><radialGradient id="sg" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#ef461b" stop-opacity="0.25"/><stop offset="100%" stop-color="#ef461b" stop-opacity="0"/></radialGradient></defs>
        <circle cx="90" cy="90" r="76" fill="url(#sg)"/>
        ${[-45,-25,0,25,45].map((dy) => `<ellipse cx="90" cy="${90+dy}" rx="${Math.sqrt(Math.max(0, 66*66 - dy*dy))}" ry="${Math.max(6, Math.sqrt(Math.max(0, 66*66 - dy*dy))*0.28)}" fill="none" stroke="#ef461b" stroke-opacity="0.45" stroke-width="0.9"/>`).join("")}
        ${[0,30,60,90,120,150].map((deg) => `<ellipse cx="90" cy="90" rx="28" ry="66" fill="none" stroke="#ef461b" stroke-opacity="0.4" stroke-width="0.9" transform="rotate(${deg} 90 90)"/>`).join("")}
        <circle cx="90" cy="90" r="66" fill="none" stroke="#ef461b" stroke-opacity="0.7" stroke-width="1.2"/>
      </svg>`;
    }

    function radarSvg(inc) {
      const axes = ["Rate Spike", "Payload Size", "Topic Entropy", "Gap Drift", "Device Drift", "Policy Risk"];
      const cx = 140, cy = 110, R = 74;
      const obs = inc.severity === "critical" ? [0.92, 0.78, 0.72, 0.85, 0.90, 0.88] : inc.severity === "high" ? [0.85, 0.65, 0.6, 0.72, 0.8, 0.7] : [0.55, 0.45, 0.4, 0.5, 0.55, 0.42];
      const exp = [0.28, 0.25, 0.22, 0.26, 0.24, 0.2];
      const pts = (vals) => vals.map((v, i) => {
        const a = (Math.PI * 2 * i) / axes.length - Math.PI / 2;
        return `${cx + Math.cos(a) * R * v},${cy + Math.sin(a) * R * v}`;
      }).join(" ");
      return `<svg viewBox="0 0 280 225" width="100%" height="215">
        ${[0.33, 0.66, 1].map((s) => `<polygon points="${pts(axes.map(() => s))}" fill="none" stroke="#2d2725" stroke-width="1"/>`).join("")}
        ${axes.map((lbl, i) => {
          const a = (Math.PI * 2 * i) / axes.length - Math.PI / 2;
          const x = cx + Math.cos(a) * (R + 18), y = cy + Math.sin(a) * (R + 14);
          return `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(a)*R}" y2="${cy + Math.sin(a)*R}" stroke="#2d2725" stroke-width="1"/>
                  <text x="${x}" y="${y}" text-anchor="middle" fill="#8b827d" font-size="9.5">${lbl}</text>`;
        }).join("")}
        <polygon points="${pts(exp)}" fill="rgba(230, 138, 46, 0.16)" stroke="#e68a2e" stroke-width="1.5"/>
        <polygon points="${pts(obs)}" fill="rgba(239, 70, 27, 0.28)" stroke="#ef461b" stroke-width="2"/>
      </svg>`;
    }

    function renderDashboard() {
      const k = state.kpis;
      const totalDevs = Math.max(1, k.devices_total || 5);
      const healthyPct = Math.round(((totalDevs - (k.devices_isolated || 0)) / totalDevs) * 100);
      const activePct = Math.min(100, Math.round(((k.open_incidents || 0) / Math.max(1, state.incidents.length)) * 100));
      const maxEvents = Math.max(1, ...state.devices.map((d) => d.event_count || 0));
      const activity = state.devices.reduce((sum, d) => sum + (Number(d.event_count) || 0), 0);

      let feedItems = [
        ...state.incidents.slice(0, 6).map((i) => ({
          id: i.id,
          crit: i.severity === "high" || i.severity === "critical",
          title: `${i.severity === "critical" || i.severity === "high" ? "Critical anomaly detected" : "Finding opened"} on ${i.device_id}`,
          sub: `${i.decision || i.detection_ref} · ${relTime(i.updated_utc)}`,
          ts: i.updated_utc || "",
        })),
        ...state.audit.slice(0, 6).map((a) => ({
          id: null,
          crit: a.verdict === "DENY",
          title: `Policy ${a.verdict === "DENY" ? "blocked" : "authorized"}: "${a.action}"`,
          sub: `${a.actor} on ${a.target} · ${relTime(a.ts_utc)}`,
          ts: a.ts_utc || "",
        })),
      ];
      if (feedSort === "critical") {
        feedItems.sort((a, b) => Number(b.crit) - Number(a.crit));
      } else {
        feedItems.sort((a, b) => b.ts.localeCompare(a.ts));
      }
      feedItems = feedItems.slice(0, 9);

      return `
        <section class="command-intro">
          <div><div class="command-eyebrow"><i></i> SECURITY OPERATIONS <span>/</span> WATCHFLOOR 01</div><h1 class="command-title">Plant security<span> / facility overview</span></h1><p class="command-copy">Live telemetry, incident triage, and response posture across the monitored facility.</p></div>
          <div class="command-status"><i></i><span><b>LIVE FEED</b><small> · telemetry stream</small></span></div>
        </section>
        <section class="kpi-grid">
          <div class="kpi-card"><div class="kpi-head"><span>MQTT events</span><span class="kpi-delta">↗ live</span></div><div class="kpi-body"><div><div class="kpi-num">${k.total_events ?? 0}</div><div class="kpi-sub">${k.devices_total ?? 0} monitored nodes</div></div>${biWaveformSvg("#40d49b")}</div></div>
          <div class="kpi-card"><div class="kpi-head"><span>Active incidents</span><span class="kpi-delta">${k.mitigated_incidents ?? 0} mitigated</span></div><div class="kpi-body"><div><div class="kpi-num">${k.open_incidents ?? 0}</div><div class="kpi-sub">${state.incidents.length} total recorded</div></div>${tickedRingSvg(activePct, "#f2b45f")}</div></div>
          <div class="kpi-card"><div class="kpi-head"><span>Fleet health</span><span class="kpi-delta">${k.devices_isolated ?? 0} isolated</span></div><div class="kpi-body"><div><div class="kpi-num">${healthyPct}%</div><div class="kpi-sub">active lab coverage</div></div>${tickedArcGaugeSvg(healthyPct)}</div></div>
          <div class="kpi-card"><div class="kpi-head"><span>Policy blocks</span><span class="kpi-delta">PolicyGate</span></div><div class="kpi-body"><div><div class="kpi-num">${k.policy_denies ?? 0}</div><div class="kpi-sub">${k.active_isolations ?? 0} active isolations</div></div>${biWaveformSvg("#f2b45f")}</div></div>
        </section>
        ${floorPlanSection()}
        <section class="lower-grid">
          <div class="card activity-card"><div class="card-head"><div><div class="panel-index">02 <span>/</span> EVENT STREAM</div><div class="card-title">Recent activity</div><div class="card-sub">Chronological signals from policy and detection</div></div><select class="select-dark" style="padding:6px 9px;font-size:11px" onchange="feedSort=this.value;render()"><option value="latest" ${feedSort==='latest'?'selected':''}>Latest first</option><option value="critical" ${feedSort==='critical'?'selected':''}>Critical first</option></select></div><div class="feed">${feedItems.length ? feedItems.map((f) => `<div class="feed-item" ${f.id ? `onclick="openIncidentDetail('${esc(f.id)}')"` : `onclick="setView('audit')"`}><div class="feed-ico ${f.crit ? 'crit' : ''}">${f.crit ? '!' : '&bull;'}</div><div class="feed-main"><strong>${esc(f.title)}</strong><span>${esc(f.sub)}</span></div><span class="feed-arrow">↗</span></div>`).join("") : `<div class="empty-feed"><span class="empty-feed-mark">◌</span><strong>No activity yet</strong><span>Events will appear here as telemetry arrives.</span></div>`}</div></div>
          <div class="card highlight-card"><div class="card-head"><div><div class="panel-index">03 <span>/</span> RESPONSE QUEUE</div><div class="card-title">Priority incidents</div><div class="card-sub">Highest-severity items requiring attention</div></div><button class="text-link" onclick="setView('findings')">All findings <span>↗</span></button></div><div class="incident-highlights">${state.incidents.slice().sort((a,b)=>({critical:0,high:1,medium:2,low:3}[a.severity]??4)-({critical:0,high:1,medium:2,low:3}[b.severity]??4)).slice(0,4).map(i=>`<button class="highlight-item" onclick="openIncidentDetail('${esc(i.id)}')"><span class="severity-mark sev-${esc(i.severity)}"></span><span class="highlight-copy"><strong>${esc(i.device_id)}</strong><small>${esc(i.id)} · ${esc(i.decision || i.detection_ref || 'Finding')}</small></span><span class="highlight-meta"><b class="severity-label ${esc(i.severity)}">${esc(i.severity)}</b><small>${esc(relTime(i.updated_utc))}</small></span><span class="highlight-arrow">›</span></button>`).join('') || `<div class="empty-feed"><span class="empty-feed-mark">✓</span><strong>All clear</strong><span>No incident highlights right now.</span></div>`}</div></div>
        </section>
      `;
    }

    function renderFindings() {
      const q = filters.q.toLowerCase();
      const sev = filters.severity;
      const rows = state.incidents.filter((i) =>
        (!sev || i.severity === sev) &&
        (!q || i.device_id.toLowerCase().includes(q) || i.id.toLowerCase().includes(q) || (i.reasoning_summary || "").toLowerCase().includes(q))
      );

      const cols = [
        { key: "open", label: "Open", dot: "#b6aeaa" },
        { key: "investigating", label: "Investigating", dot: "#e68a2e" },
        { key: "mitigated", label: "Mitigated", dot: "#ef461b" },
        { key: "resolved", label: "Resolved", dot: "#22c55e" },
      ];

      let body = "";
      if (!rows.length) {
        body = `<div class="empty-sphere">
          ${wireframeSphereSvg()}
          <strong style="font-size:15px">Nice, no findings match these filters!</strong>
          <span style="color:var(--text-muted)">Clear your search filter or run a lab anomaly check to generate findings.</span>
          <button class="cta-btn" style="padding:0 16px;border-radius:7px" onclick="filters={q:'',severity:''};render()">Reset filters</button>
        </div>`;
      } else if (findingsMode === "kanban") {
        body = `<div class="kanban">${cols.map((c) => {
          const items = rows.filter((r) => r.status === c.key);
          return `<div class="k-col">
            <div class="k-col-head"><span class="sev-dot" style="background:${c.dot}"></span>${c.label} (${items.length})</div>
            ${items.map((i) => `
              <div class="k-card sev-${esc(i.severity)}" onclick="openIncidentDetail('${esc(i.id)}')">
                <div class="k-top">
                  <span class="k-id"><span class="sev-dot"></span>${esc(i.id)}</span>
                  <span style="font-size:10.5px;color:var(--text-muted)">${esc(i.severity)}</span>
                </div>
                <div class="k-asset">${deviceIcon(deviceById(i.device_id))}<span>${esc(i.device_id)}</span> ${roomBadge((deviceById(i.device_id) || {}).room)} &middot; ${esc(i.decision || i.detection_ref)}</div>
                <div class="k-foot">
                  <span>${esc((i.updated_utc || "").slice(0, 10))}</span>
                  <span class="assignee">AI</span>
                </div>
              </div>
            `).join("")}
          </div>`;
        }).join("")}</div>`;
      } else {
        body = `<div class="table-wrap"><table>
          <thead><tr><th>ID</th><th>Severity</th><th>Asset</th><th>Room</th><th>Decision</th><th>Status</th><th>Updated</th></tr></thead>
          <tbody>${rows.map((i) => `
            <tr class="click-row sev-${esc(i.severity)}" onclick="openIncidentDetail('${esc(i.id)}')">
              <td><code>${esc(i.id)}</code></td>
              <td><span class="sev-dot"></span>${esc(i.severity)}</td>
              <td><div class="dev-cell">${deviceIcon(deviceById(i.device_id))}<span>${esc(i.device_id)}</span></div></td>
              <td>${roomBadge((deviceById(i.device_id) || {}).room)}</td>
              <td>${esc(i.decision || i.detection_ref)}</td>
              <td><span class="pill-status ${esc(i.status)}">${esc(i.status)}</span></td>
              <td>${esc(relTime(i.updated_utc))}</td>
            </tr>
          `).join("")}</tbody>
        </table></div>`;
      }

      return `
        <div class="topbar">
          <div>

    function renderAudit() {
      return `
        <div class="topbar"><div><div class="crumb">Home &rsaquo; Policy Audit</div><h1 class="page-title">Policy Gate Audit Log</h1></div></div>
        ${auditStrip()}

          <tbody>${state.audit.length ? state.audit.map((a) => `

          </tbody>

    }

    function statStrip(items) {
      return `<div class="stat-strip">${items.map((i) => `<button class="stat ${i.c || ""} ${i.k !== undefined && i.k === filters.severity ? "act" : ""}" ${i.on ? `onclick="${i.on}"` : "disabled"}><span>${i.l}</span><strong>${i.v}</strong></button>`).join("")}</div>`;
    }
    const findingsStrip = () => statStrip([{ l: "All findings", v: state.incidents.length, k: "", on: "filters.severity='';render()" }, ...["critical", "high", "medium", "low"].map((v) => ({ l: v, v: state.incidents.filter((i) => i.severity === v).length, k: v, c: "sev-" + v, on: `filters.severity='${v}';render()` }))]);
    const deviceStrip = () => { const d = state.devices, n = (x) => d.filter((y) => fpState(y) === x).length; return statStrip([{ l: "Total devices", v: d.length }, { l: "Healthy", v: n("ok"), c: "sev-low" }, { l: "Under incident", v: n("alert"), c: "sev-high" }, { l: "Isolated", v: n("iso"), c: "sev-critical" }]); };
    const isoStrip = () => { const a = state.isolations.filter((x) => x.status === "active").length; return statStrip([{ l: "Active isolations", v: a, c: "sev-critical" }, { l: "Released", v: state.isolations.length - a, c: "sev-low" }, { l: "Total", v: state.isolations.length }]); };
    const auditStrip = () => { const d = state.audit.filter((x) => x.verdict === "DENY").length; return statStrip([{ l: "Policy decisions", v: state.audit.length }, { l: "Allowed", v: state.audit.length - d, c: "sev-low" }, { l: "Denied", v: d, c: "sev-critical" }]); };

    function render() {
      const activeEl = document.activeElement;
      const focusId = activeEl && activeEl.id === "findings-search" ? "findings-search" : null;
      const selStart = focusId ? activeEl.selectionStart : null;

      const root = document.getElementById("main-root");
      if (currentView === "dashboard") root.innerHTML = renderDashboard();
      else if (currentView === "findings") root.innerHTML = renderFindings();
      else if (currentView === "incidents") root.innerHTML = renderIncidentDetail();
      else if (currentView === "devices") root.innerHTML = renderDevices();
      else if (currentView === "isolations") root.innerHTML = renderIsolations();
      else root.innerHTML = renderAudit();

      if (focusId) {
        const el = document.getElementById(focusId);
        if (el) {
          el.focus();
          if (selStart !== null) el.setSelectionRange(selStart, selStart);

    }

    // ───────── Facility floor plan ─────────
    // [x, y, w, h, label] in a 1100x520 viewBox. Keys are normalised room names.
    const FP_ROOMS = {
      "admin offices": [20, 20, 190, 120, "Admin Offices"],
      "reception": [218, 20, 150, 120, "Reception"],
      "control room": [376, 20, 170, 120, "Control Room"],
      "server room": [554, 20, 170, 120, "Server Room"],

      "assembly hall": [744, 190, 170, 150, "Assembly Hall"],
      "packaging area": [922, 190, 158, 150, "Packaging Area"],
      "main gate": [20, 348, 140, 152, "Main Gate"],
      "boiler room": [168, 348, 150, 152, "Boiler Room"],
      "finished goods warehouse": [326, 348, 260, 152, "Finished Goods Warehouse"],
      "loading dock": [594, 348, 200, 152, "Loading Dock"],
      "parking": [802, 348, 278, 152, "Parking"],
    };
    const FP_CODES = [["camera","CAM"],["plc","PLC"],["robotic","ARM"],["conveyor","CNV"],["valve","VLV"],["lock","LCK"],["hvac","HVC"],["lighting","LGT"],["meter","MTR"],["temperature","TMP"],["humidity","HUM"],["pressure","PRS"],["vibration","VIB"],["gas","GAS"],["smoke","SMK"],["motion","MOT"],["door","DOR"],["flow","FLW"],["rfid","RFD"],["gateway","GTW"],["switch","SW"],["access point","AP"],["hmi","HMI"],["badge","BDG"]];
    const fpKey = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    const fpCode = (t) => { t = String(t || "").toLowerCase(); for (const [k, c] of FP_CODES) if (t.includes(k)) return c; return "···"; };
    const fpState = (d) => d.status === "isolated" ? "iso" : (d.open_incidents || 0) > 0 ? "alert" : "ok";

    // ───────── Device identity, rooms and sensor icons ─────────
    const DEV_ICONS = {
      temp: '<path d="M10 14.8V5a2 2 0 0 1 4 0v9.8a4 4 0 1 1-4 0Z"/><path d="M12 9v6"/>',

      reed: '<path d="M4 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17"/><path d="M6 12h5"/><circle cx="15" cy="12" r="2"/><path d="M18 12h2"/>',
      plug: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0V8Z"/><path d="M12 17v4"/>',
      smoke: '<path d="M7 17a4 4 0 0 1 1-7.9 5 5 0 0 1 9.4 1A3.5 3.5 0 0 1 17 17H7Z"/><path d="M9 20h6"/>',
      gas: '<path d="M9 7V4h6v3"/><rect x="6" y="7" width="12" height="14" rx="2"/><path d="M9 12h6M9 16h6"/><circle cx="12" cy="19" r="0.8"/>',
      pressure: '<path d="M4 17a8 8 0 1 1 16 0"/><path d="m12 17 4-5"/><circle cx="12" cy="17" r="1.5"/>',
      vibration: '<path d="M2 12h3l2-6 3 12 3-9 2 6 2-3h5"/>',
      flow: '<path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 16h13a3 3 0 1 1-3 3"/>',
      camera: '<rect x="3" y="7" width="13" height="10" rx="2"/><path d="m16 11 5-3v8l-5-3Z"/>',
      network: '<rect x="9" y="9" width="6" height="6" rx="1"/><path d="M12 2v7M12 15v7M2 12h7M15 12h7"/>',
      gateway: '<rect x="3" y="8" width="18" height="8" rx="2"/><path d="M7 12h3M11 9l3 3-3 3"/><circle cx="18" cy="12" r="1"/>',
      switch: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M10 14h.01M14 14h.01M18 14h.01"/>',
      ap: '<path d="M3 9a13 13 0 0 1 18 0M6 12.5a8.5 8.5 0 0 1 12 0"/><circle cx="12" cy="17" r="1.8"/><path d="M9.5 19.5a3.5 3.5 0 0 1 5 0"/>',
      valve: '<path d="M3 12h5M16 12h5"/><path d="m8 8 8 8M16 8 8 16"/><circle cx="12" cy="12" r="2"/>',
      hvac: '<circle cx="12" cy="12" r="2"/><path d="M12 10V3M14 12h7M12 14v7M10 12H3"/>',
      light: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/>',
      meter: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8 15 4-5 4 3"/><path d="M8 7h8"/>',
      arm: '<path d="M4 21h6M7 21V9l6-4 5 5-6 5"/>',
      conveyor: '<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 14h12M7 8h10v6H7z"/>',
      card: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
      badge: '<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="9" r="2.5"/><path d="M8 16h8M9 19h6"/>',
      rfid: '<rect x="3" y="7" width="18" height="10" rx="2"/><path d="M8 12h.01M12 12h.01M16 12h.01"/><path d="M7 4a7 7 0 0 0 0 16M17 4a7 7 0 0 1 0 16"/>',
      chip: '<rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
      plc: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M6 8h6M6 12h6M6 16h6"/><circle cx="17" cy="8" r="1"/><circle cx="17" cy="12" r="1"/><path d="M16 16h2"/>',

      clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'
    };
    const deviceIconKey = (d) => {
      const s = `${d.device_type || ""} ${d.device_id || ""} ${d.hardware || ""}`.toLowerCase();
      if (/rfid|uhf/.test(s)) return "rfid";
      if (/badge|nfc|wiegand/.test(s)) return "badge";
      if (/humid|rh probe|dht22/.test(s)) return "humidity";
      if (/temp|climate|bme280/.test(s)) return "temp";
      if (/motion|pir/.test(s)) return "motion";
      if (/gas|electrochemical/.test(s)) return "gas";
      if (/smoke|optical/.test(s)) return "smoke";
      if (/deadbolt|smart lock/.test(s)) return "lock";
      if (/reed|door sensor/.test(s)) return "reed";
      if (/door/.test(s)) return "door";
      if (/pressure|piezo/.test(s)) return "pressure";
      if (/vibrat|accelerometer|mems/.test(s)) return "vibration";
      if (/flow|ultrasonic/.test(s)) return "flow";
      if (/camera|rtsp/.test(s)) return "camera";
      if (/switch|managed l2/.test(s)) return "switch";
      if (/gateway/.test(s)) return "gateway";
      if (/access point|wi.fi ap/.test(s)) return "ap";
      if (/network/.test(s)) return "network";
      if (/valve|solenoid/.test(s)) return "valve";
      if (/hvac|modbus/.test(s)) return "hvac";
      if (/light|dimmable/.test(s)) return "light";
      if (/meter|power|acs712/.test(s)) return "meter";
      if (/plug|relay/.test(s)) return "plug";
      if (/arm|robotic|servo/.test(s)) return "arm";
      if (/conveyor|vfd/.test(s)) return "conveyor";
      if (/plc|ladder/.test(s)) return "plc";
      if (/hmi|touch panel/.test(s)) return "hmi";
      return "clock";
    };
    const deviceIcon = (d, cls = "") => `<svg class="dev-ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${DEV_ICONS[deviceIconKey(d)]}</svg>`;
    const roomLabel = (s) => {
      const t = String(s || "").trim();
      if (!t) return "Unknown room";
      const m = t.match(/^([a-z]+)(\d+)$/i);
      if (m) return `${m[1].charAt(0).toUpperCase()}${m[1].slice(1).toLowerCase()} ${m[2]}`;
      return t.replace(/[_-]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());

    const deviceById = (id) => state.devices.find((d) => d.device_id === id);

    function floorPlanSvg() {
      const ZONE = {"admin offices":"office","reception":"office","control room":"it","server room":"it","quality lab":"it","electrical room":"util","boiler room":"util","raw materials storage":"store","finished goods warehouse":"store","production line 1":"prod","production line 2":"prod","assembly hall":"prod","packaging area":"prod","main gate":"out","loading dock":"out","parking":"out"};
      const cat = (t) => { t = String(t || "").toLowerCase(); if (t.includes("camera")) return "cam"; if (/gateway|switch|access point|hmi|badge/.test(t)) return "net"; if (/plc|robotic|conveyor|valve|lock|hvac|lighting|meter/.test(t)) return "ctl"; return "sen"; };
      const shape = (c) => c === "cam" ? '<polygon class="fp-mk" points="0,-9 9,7 -9,7"/>' : c === "net" ? '<polygon class="fp-mk" points="0,-9 9,0 0,9 -9,0"/>' : c === "ctl" ? '<rect class="fp-mk" x="-7.5" y="-7.5" width="15" height="15" rx="1.5"/>' : '<circle class="fp-mk" r="7.5"/>';
      const props = (k, x, y, w, h) => {
        const b = y + h;
        if (k.startsWith("production line")) return `<rect class="fp-prop-f" x="${x + 14}" y="${b - 26}" width="${w - 28}" height="14"/>` + Array.from({ length: Math.floor((w - 40) / 22) }, (_, i) => `<circle class="fp-prop" cx="${x + 26 + i * 22}" cy="${b - 19}" r="4"/>`).join("");
        if (k === "assembly hall") return [0, 1, 2].map((i) => `<rect class="fp-prop-f" x="${x + 16 + i * 50}" y="${b - 30}" width="36" height="18"/>`).join("");
        if (k === "raw materials storage" || k === "finished goods warehouse") return [0, 1].map((i) => `<rect class="fp-prop-f" x="${x + 14}" y="${b - 30 + i * 12}" width="${w - 28}" height="7"/>`).join("");
        if (k === "server room") return Array.from({ length: 5 }, (_, i) => `<rect class="fp-prop-f" x="${x + 14 + i * 24}" y="${b - 24}" width="18" height="12"/>`).join("");
        if (k === "boiler room") return `<circle class="fp-prop-f" cx="${x + w - 34}" cy="${b - 32}" r="18"/><circle class="fp-prop-f" cx="${x + 34}" cy="${b - 30}" r="14"/>`;
        if (k === "parking") return Array.from({ length: Math.floor((w - 24) / 26) }, (_, i) => `<line class="fp-prop" x1="${x + 18 + i * 26}" y1="${b - 34}" x2="${x + 18 + i * 26}" y2="${b - 8}"/>`).join("");
        if (k === "loading dock") return [0, 1, 2].map((i) => `<rect class="fp-prop-f" x="${x + 16 + i * 60}" y="${b - 8}" width="44" height="8"/>`).join("");
        return "";
      };
      const door = (k, x, y, w, h) => {
        if (k === "parking") return "";
        const dx = x + w - 40;
        return y < 150
          ? `<line class="fp-gap" x1="${dx}" y1="${y + h}" x2="${dx + 24}" y2="${y + h}"/><path class="fp-swing" d="M${dx} ${y + h}V${y + h - 24}A24 24 0 0 1 ${dx + 24} ${y + h}"/>`
          : `<line class="fp-gap" x1="${dx}" y1="${y}" x2="${dx + 24}" y2="${y}"/><path class="fp-swing" d="M${dx} ${y}V${y + 24}A24 24 0 0 0 ${dx + 24} ${y}"/>`;
      };
      const groups = {};
      state.devices.forEach((d) => { const k = fpKey(d.room); if (FP_ROOMS[k]) (groups[k] = groups[k] || []).push(d); });
      const rooms = Object.entries(FP_ROOMS).map(([k, [x, y, w, h, label]]) => {
        const ds = groups[k] || [];
        const st = ds.some((d) => fpState(d) === "iso") ? "iso" : ds.some((d) => fpState(d) === "alert") ? "alert" : "";
        const cols = Math.max(1, Math.floor((w - 20) / 24));
        const dots = ds.map((d, i) => `<g class="fp-dev ${fpState(d)}" data-id="${esc(d.device_id)}" onclick="deviceClick(this.dataset.id)" transform="translate(${x + 22 + (i % cols) * 24} ${y + 42 + Math.floor(i / cols) * 24})"><circle class="fp-ring" r="10"/>${shape(cat(d.device_type))}<g class="fp-ico" transform="translate(-8,-8) scale(.66)">${DEV_ICONS[deviceIconKey(d)]}</g></g>`).join("");
        return `<g class="fp-room z-${ZONE[k]} ${st}"><rect class="fp-fill" x="${x}" y="${y}" width="${w}" height="${h}"/>${props(k, x, y, w, h)}${door(k, x, y, w, h)}<text class="fp-label" x="${x + 10}" y="${y + 20}">${label.toUpperCase()}</text><text class="fp-count" x="${x + w - 10}" y="${y + 20}" text-anchor="end">${ds.length || ""}</text>${dots}</g>`;
      }).join("");
      return `<svg viewBox="0 0 1100 520" role="img" aria-label="Facility floor plan with device locations"><defs><pattern id="fpHatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#12161a"/><line x1="0" y1="0" x2="0" y2="9" stroke="#1b2228" stroke-width="2"/></pattern><pattern id="fpHatchO" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#0b0e10"/><line x1="0" y1="0" x2="0" y2="9" stroke="#141a1f" stroke-width="2"/></pattern></defs><line class="fp-corr" x1="20" y1="165" x2="1080" y2="165"/><text class="fp-corr-t" x="550" y="160">MAIN CORRIDOR</text>${rooms}</svg>`;
    }

    function roomRoster() {
      const groups = {};
      state.devices.forEach((d) => { const k = roomLabel(d.room); (groups[k] = groups[k] || []).push(d); });
      const keys = Object.keys(groups).sort((a, b) => a.localeCompare(b));
      if (!keys.length) return "";
      return `<div class="room-roster">${keys.map((k) => `<div class="roster-room"><strong>${esc(k)} · ${groups[k].length}</strong>${groups[k].map((d) => `<div class="roster-dev" onclick="deviceClick('${esc(d.device_id)}')" title="${esc(d.hardware || d.device_type || "")}">${deviceIcon(d)}<span>${esc(d.device_id)}</span></div>`).join("")}</div>`).join("")}</div>`;
    }

    function floorPlanSection() {
      const ds = state.devices;
      const iso = ds.filter((d) => fpState(d) === "iso").length;
      const alert = ds.filter((d) => fpState(d) === "alert").length;
      const un = ds.filter((d) => !FP_ROOMS[fpKey(d.room)]).length;
      return `<section class="card plan-card">
        <div class="card-head">
          <div><div class="panel-index">01 <span>/</span> FACILITY FLOOR PLAN</div><div class="card-title">Device locations</div><div class="card-sub">${ds.length} devices · ${alert} under incident · ${iso} isolated${un ? ` · ${un} in unmapped rooms` : ""}</div></div>
          <div class="plan-legend"><span><i></i>Healthy</span><span><i class="alert"></i>Incident</span><span><i class="iso"></i>Isolated</span><button class="btn-ghost" onclick="refreshAll()">Refresh ↻</button></div>
        </div>
        <div class="plan-stage">${floorPlanSvg()}</div>
        ${roomRoster()}
      </section>`;
    }

    const fpTip = document.createElement("div");
    fpTip.className = "fp-tip";
    document.body.appendChild(fpTip);
    document.addEventListener("mousemove", (e) => {
      const g = e.target.closest && e.target.closest(".fp-dev");
      const d = g && state.devices.find((x) => x.device_id === g.dataset.id);
      if (!d) { fpTip.style.display = "none"; return; }
      const s = fpState(d);
      fpTip.innerHTML = `<div class="dev-tip-head">${deviceIcon(d, "lg")}<b>${esc(d.device_id)}</b></div>
        <div>Type<span>${esc(d.device_type || "-")}</span></div><div>Room<span>${esc(roomLabel(d.room))}</span></div>
        <div>Hardware<span>${esc(d.hardware || "-")}</span></div>
        <div>IP<span>${esc(d.ip || "-")}</span></div><div>MAC<span>${esc(d.mac || "-")}</span></div>
        <div>Topic<span>${esc(d.topic || "-")}</span></div><div>QoS<span>${esc(d.qos ?? "-")}</span></div>
        <div>Status<span>${s === "iso" ? "Isolated" : s === "alert" ? "Under incident" : "Healthy"}</span></div>
        <div>Events<span>${d.event_count ?? 0}</span></div><div>Open incidents<span>${d.open_incidents ?? 0}</span></div>
        <div>Last seen<span>${esc(relTime(d.last_seen))}</span></div>`;
      fpTip.style.display = "block";
      const w = fpTip.offsetWidth, h = fpTip.offsetHeight;
      fpTip.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + "px";
      fpTip.style.top = (e.clientY + 16 + h > innerHeight ? e.clientY - h - 12 : e.clientY + 16) + "px";
    });

    // ───────── Data layer: real API first, simulated plant data if the API is unreachable ─────────
    const DEMO = { on: false, seeded: false, n: 0 };
    const DEMO_ROOMS = {
      "Main Gate": ["IP Camera","Smart Lock","Badge Reader","RFID Reader","Motion Sensor"],
      "Reception": ["IP Camera","Badge Reader","Door Sensor","Smart Lighting","Access Point"],
      "Admin Offices": ["Access Point","HVAC Controller","Smart Lighting","Door Sensor","Temperature Sensor"],
      "Server Room": ["Gateway","Industrial Switch","IP Camera","Temperature Sensor","Humidity Sensor","Smoke Detector","Smart Lock","Smart Meter","HVAC Controller"],
      "Control Room": ["HMI Panel","Gateway","IP Camera","Access Point","Door Sensor","Smart Lock"],
      "Raw Materials Storage": ["IP Camera","Temperature Sensor","Humidity Sensor","RFID Reader","Door Sensor","Smoke Detector"],
      "Production Line 1": ["PLC","Robotic Arm","Conveyor Controller","HMI Panel","Vibration Sensor","Temperature Sensor","Pressure Sensor","Motion Sensor","IP Camera"],
      "Production Line 2": ["PLC","Robotic Arm","Conveyor Controller","HMI Panel","Vibration Sensor","Temperature Sensor","Pressure Sensor","Motion Sensor","IP Camera"],
      "Assembly Hall": ["PLC","Robotic Arm","HMI Panel","Vibration Sensor","Motion Sensor","IP Camera","Industrial Switch"],
      "Packaging Area": ["PLC","Conveyor Controller","HMI Panel","Motion Sensor","RFID Reader","IP Camera"],
      "Quality Lab": ["HMI Panel","Temperature Sensor","Humidity Sensor","Gas Sensor","Smart Lock","IP Camera","Access Point"],
      "Finished Goods Warehouse": ["IP Camera","RFID Reader","Temperature Sensor","Humidity Sensor","Smoke Detector","Door Sensor","Smart Lighting"],
      "Loading Dock": ["IP Camera","RFID Reader","Smart Lock","Motion Sensor","Door Sensor","Badge Reader"],
      "Boiler Room": ["Smart Valve","Pressure Sensor","Temperature Sensor","Flow Meter","Gas Sensor","Smoke Detector","Vibration Sensor"],
      "Electrical Room": ["Smart Meter","Temperature Sensor","Smoke Detector","Smart Lock","Door Sensor","HVAC Controller"],
      "Parking": ["IP Camera","Motion Sensor","Smart Lighting","Smart Lock","Badge Reader"],
    };
    const DEMO_HW = {
      "IP Camera":"RTSP/MQTT Edge Camera", "Smart Lock":"Smart Deadbolt Controller", "Badge Reader":"NFC/Wiegand Badge Reader",
      "RFID Reader":"UHF RFID Gate Reader", "Motion Sensor":"PIR Motion Sensor", "Door Sensor":"Magnetic Reed Door Sensor",
      "Smart Lighting":"Dimmable Relay Controller", "Access Point":"Industrial Wi-Fi AP", "HVAC Controller":"Modbus/MQTT HVAC Relay",
      "Temperature Sensor":"Industrial Temp Probe", "Humidity Sensor":"Industrial RH Probe", "Gateway":"MQTT Edge Gateway",
      "Industrial Switch":"Managed L2/L3 Switch", "Smoke Detector":"Optical Smoke Detector", "Smart Meter":"3-Phase Power Meter",
      "HMI Panel":"Operator HMI Touch Panel", "PLC":"Industrial PLC Controller", "Robotic Arm":"6-Axis Servo Robotic Arm",
      "Conveyor Controller":"VFD Conveyor Drive", "Vibration Sensor":"Tri-Axial MEMS Accelerometer", "Pressure Sensor":"Piezo Pressure Transmitter",
      "Gas Sensor":"Electrochemical Gas Detector", "Smart Valve":"Motorized Solenoid Valve", "Flow Meter":"Ultrasonic Flow Meter"
    };
    const iso8 = (m) => new Date(Date.now() - m * 60000).toISOString();
    const pickOne = (a, fallback = null) => a.length ? a[Math.floor(Math.random() * a.length)] : fallback;

    function demoInc(id, d, sev, status, det, dec, reason, mins) {
      const step = (k, actor, summary, m) => ({ kind: k, actor, ts_utc: iso8(m), summary, details: {} });
      return { id, device_id: d.device_id, severity: sev, status, detection_ref: det, decision: dec, action: dec === "isolate" ? "isolate_device" : dec, outcome: status === "resolved" ? "cleared" : status === "mitigated" ? "contained" : "pending", reasoning_summary: reason, created_utc: iso8(mins + 6), updated_utc: iso8(mins),
        timeline: [step("detection", "Detector", `${det.replace("_", " ")} on ${d.device_id} (${d.room})`, mins + 6), step("decision", "Defense Agent", `Decision: ${dec}. ${reason}`, mins + 4), step("policy", "PolicyGate", `${dec} authorized for ${d.device_id}`, mins + 3)] };
    }
    function demoKpis() {
      const open = state.incidents.filter((i) => i.status === "open" || i.status === "investigating").length;
      const iso = state.devices.filter((d) => d.status === "isolated").length;
      state.devices.forEach((d) => { d.open_incidents = state.incidents.filter((i) => i.device_id === d.device_id && (i.status === "open" || i.status === "investigating")).length; });
      return { devices_total: state.devices.length, total_events: state.devices.reduce((s, d) => s + d.event_count, 0), open_incidents: open, mitigated_incidents: state.incidents.filter((i) => i.status === "mitigated").length, devices_isolated: iso, active_isolations: state.isolations.filter((x) => x.status === "active").length, policy_denies: state.audit.filter((a) => a.verdict === "DENY").length };
    }
    function demoSeed() {
      const ab = (s) => s.split(" ").map((w) => w[0]).join("").toUpperCase();
      let ri = 0; state.devices = [];
      for (const [room, types] of Object.entries(DEMO_ROOMS)) {
        ri++;
        const rkey = room.toLowerCase().replace(/[^a-z0-9]+/g, "_");
        types.forEach((t, i) => {
          const slug = t.toLowerCase().replace(/[^a-z0-9]+/g, "_");
          const hex = (n) => n.toString(16).toUpperCase().padStart(2, "0");
          state.devices.push({
            device_id: `${ab(t)}-${ab(room)}-${String(i + 1).padStart(2, "0")}`,
            device_type: t, room,
            hardware: DEMO_HW[t] || t,
            ip: `10.20.${ri}.${10 + i}`,
            mac: `A0:CE:${hex(ri)}:${hex(i + 10)}:${hex(Math.floor(Math.random() * 256))}:${hex(ri * 10 + i)}`,
            qos: /camera|gateway|plc|lock|smoke|motion|hmi|valve|badge|rfid/.test(t) ? 1 : 0,
            topic: `lab/${rkey}/${slug}`,
            last_seen: iso8(Math.floor(Math.random() * 9)),
            status: "online", event_count: 40 + Math.floor(Math.random() * 860), open_incidents: 0
          });
        });
      }
      const dev = (r, t) => state.devices.find((d) => d.room === r && d.device_type === t);
      state.incidents = [
        demoInc("INC-1048", dev("Production Line 1", "PLC"), "critical", "investigating", "rate_spike", "isolate", "Command rate 9x above baseline; matches lateral-movement pattern.", 7),
        demoInc("INC-1047", dev("Boiler Room", "Smart Valve"), "high", "open", "payload_anomaly", "monitor", "Valve payload size outside learned envelope.", 19),
        demoInc("INC-1046", dev("Server Room", "Gateway"), "high", "open", "topic_entropy", "escalate", "Unusual topic fan-out from the gateway.", 34),
        demoInc("INC-1045", dev("Loading Dock", "IP Camera"), "medium", "mitigated", "gap_drift", "isolate", "Heartbeat gaps drifting; camera quarantined then cleared.", 95),
        demoInc("INC-1044", dev("Raw Materials Storage", "Temperature Sensor"), "low", "resolved", "device_drift", "log", "Calibration drift within tolerance after reboot.", 240),
      ];
      const plc = dev("Production Line 1", "PLC"); plc.status = "isolated";
      state.isolations = [{ device_id: plc.device_id, status: "active", actor: "Defense Agent", reason: "Critical rate spike (INC-1048)", started_utc: iso8(6), incident_id: "INC-1048" }, { device_id: dev("Loading Dock", "IP Camera").device_id, status: "released", actor: "Defense Agent", reason: "Gap drift (INC-1045)", started_utc: iso8(90), incident_id: "INC-1045" }];
      const au = (m, actor, action, target, verdict, reason) => ({ ts_utc: iso8(m), actor, action, target, verdict, reason });
      state.audit = [au(6, "Defense Agent", "isolate_device", plc.device_id, "ALLOW", "Critical severity, within isolation policy"), au(12, "Defense Agent", "disable_safety_interlock", plc.device_id, "DENY", "Safety systems are never auto-modified"), au(33, "Defense Agent", "reboot_device", "GTW-SR-01", "DENY", "Server Room gateway requires human approval"), au(90, "Defense Agent", "isolate_device", dev("Loading Dock", "IP Camera").device_id, "ALLOW", "Medium severity, camera class permitted"), au(70, "SOC Operator", "release_device", dev("Loading Dock", "IP Camera").device_id, "ALLOW", "Manual release after review"), au(200, "Fallback engine", "log_event", "TS-RMS-02", "ALLOW", "Low severity, log only")];
      state.kpis = demoKpis(); DEMO.seeded = true;
    }
    function setLive(demo) {
      const l = document.getElementById("live-label"), d = document.getElementById("sse-dot");
      if (l) l.textContent = demo ? "Demo mode · simulated" : "Live telemetry";
      if (d) { d.style.background = demo ? "var(--amber)" : ""; d.style.boxShadow = demo ? "0 0 0 3px rgba(229,162,58,.18)" : ""; }
    }
    function useDemo() {
      if (!DEMO.seeded) demoSeed();
      DEMO.on = true; setLive(true);
      state.kpis = demoKpis();
      document.getElementById("nav-open-badge").textContent = state.kpis.open_incidents;
    }
    function toast(m) {
      let t = document.getElementById("toast");
      if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
      t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2600);
    }
    function deviceClick(id) {
      const inc = state.incidents.filter((i) => i.device_id === id).sort((a, b) => String(b.updated_utc).localeCompare(String(a.updated_utc)))[0];
      if (inc) openIncidentDetail(inc.id); else toast(`${id}: no incidents recorded`);
    }

    async function loadHealth() {
      try {
        const h = await fetch("/api/health").then((r) => { if (!r.ok) throw 0; return r.json(); });
        state.health = h;
        const g = document.getElementById("groq-chip"), d = document.getElementById("ds-chip");
        g.textContent = `Groq: ${h.llm_mode.groq}`; d.textContent = `DeepSeek: ${h.llm_mode.deepseek}`;
        g.classList.toggle("live", h.llm_mode.groq === "live"); d.classList.toggle("live", h.llm_mode.deepseek === "live");
      } catch (e) {
        document.getElementById("groq-chip").textContent = "Groq: demo"; document.getElementById("ds-chip").textContent = "DeepSeek: demo";
      }
    }

    async function refreshAll() {
      try {
        const get = (u) => fetch(u).then((r) => { if (!r.ok) throw 0; return r.json(); });
        const [ov, inc, iso, aud] = await Promise.all([get("/api/overview"), get("/api/incidents"), get("/api/isolations"), get("/api/audit")]);
        DEMO.on = false; setLive(false);
        state.kpis = ov.kpis; state.devices = ov.devices; state.incidents = inc.incidents; state.isolations = iso.isolations; state.audit = aud.audit;
        document.getElementById("nav-open-badge").textContent = ov.kpis.open_incidents ?? 0;
      } catch (e) { useDemo(); }
      render();
    }

    async function openIncidentDetail(id) {
      selectedIncidentId = id; currentView = "incidents";
      document.querySelectorAll(".nav-item[data-view]").forEach((el) => el.classList.toggle("active", el.dataset.view === "incidents"));
      if (DEMO.on) state.selectedIncident = state.incidents.find((i) => i.id === id);
      else { try { state.selectedIncident = await fetch(`/api/incidents/${encodeURIComponent(id)}`).then((r) => r.json()); } catch (e) { state.selectedIncident = state.incidents.find((i) => i.id === id); } }
      render();
    }

    async function releaseDevice(deviceId, incidentId) {
      if (DEMO.on) {
        const d = state.devices.find((x) => x.device_id === deviceId); if (d) d.status = "online";
        state.isolations.forEach((x) => { if (x.device_id === deviceId && x.status === "active") x.status = "released"; });
        const inc = state.incidents.find((i) => i.id === incidentId);
        if (inc) { inc.status = "mitigated"; inc.outcome = "contained"; inc.updated_utc = iso8(0); inc.timeline.push({ kind: "action", actor: "SOC Operator", ts_utc: iso8(0), summary: `Released ${deviceId} from isolation`, details: {} }); }
        state.audit.unshift({ ts_utc: iso8(0), actor: "SOC Operator", action: "release_device", target: deviceId, verdict: "ALLOW", reason: "Manual release" });
        state.kpis = demoKpis(); document.getElementById("nav-open-badge").textContent = state.kpis.open_incidents;
        toast(`${deviceId} released from isolation`);
      } else {
        let token = sessionStorage.getItem("cerberus.dashboard.token");
        if (!token) {
          token = window.prompt("CERBERUS dashboard release token:") || "";
          if (token) sessionStorage.setItem("cerberus.dashboard.token", token);
        }
        const qs = incidentId ? `?incident_id=${encodeURIComponent(incidentId)}` : "";
        try {
          const res = await fetch(`/api/isolations/${encodeURIComponent(deviceId)}/release${qs}`, {
            method: "POST",
            headers: { "X-Cerberus-Token": token },
          });
          if (!res.ok) throw new Error(String(res.status));
          toast(`${deviceId} released`);
        } catch (e) { toast(`Release failed: ${e.message || "API unreachable"}`); }
        await refreshAll();
      }
      if (selectedIncidentId) await openIncidentDetail(selectedIncidentId); else render();
    }

    function demoTick() {
      if (!DEMO.on) return;
      state.devices.forEach((d) => { if (d.status !== "isolated" && Math.random() < 0.35) d.event_count += 1 + Math.floor(Math.random() * 6); });
      if (++DEMO.n % 6 === 0 && state.incidents.length < 14) {
        const d = pickOne(state.devices.filter((x) => x.status !== "isolated" && x.open_incidents === 0));
        if (!d) return;
        const sev = pickOne(["medium", "high", "low"]);
        state.incidents.unshift(demoInc(`INC-${1049 + state.incidents.length - 5}`, d, sev, "open", pickOne(["rate_spike", "payload_anomaly", "gap_drift"]), "monitor", "Behaviour deviates from the learned baseline.", 0));
        toast(`New finding on ${d.device_id}`);
      }
      state.kpis = demoKpis(); document.getElementById("nav-open-badge").textContent = state.kpis.open_incidents;
      if (currentView === "dashboard") render();
    }
    setInterval(demoTick, 6000);

    loadHealth();
    refreshAll();
    const es = new EventSource("/api/stream");
    es.onmessage = (ev) => {
      const data = JSON.parse(ev.data);
      if (DEMO.on) return;
      const changed =
        JSON.stringify(state.kpis) !== JSON.stringify(data.kpis) ||
        JSON.stringify(state.audit) !== JSON.stringify(data.audit) ||
        state.incidents.length !== data.incidents.length ||
        state.isolations.length !== data.isolations.length;
      state.kpis = data.kpis;
      state.devices = data.devices;
      state.incidents = data.incidents;
      state.isolations = data.isolations;
      state.audit = data.audit ?? state.audit;
      document.getElementById("nav-open-badge").textContent = data.kpis.open_incidents ?? 0;
      if (changed) render();
    };
  </script>
</body>
</html>
