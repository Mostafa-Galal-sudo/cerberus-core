<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CERBERUS · SOC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0909;
      --sidebar: #100f0f;
      --surface: #131111;
      --card: #171515;
      --card-elev: #1b1817;
      --hover: #211d1c;
      --border: #24201f;
      --border-strong: #332d2b;
      --text: #f3efed;
      --text-soft: #b6aeaa;
      --text-muted: #766e6a;
      --accent: #ef461b;
      --accent-hover: #ff582d;
      --accent-soft: rgba(239, 70, 27, 0.14);
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.14);
      --amber: #e68a2e;
      --amber-soft: rgba(230, 138, 46, 0.14);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(ellipse 85% 32% at 58% -8%, rgba(204, 62, 22, 0.34), rgba(110, 30, 10, 0.12) 48%, transparent 74%),
        var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.45;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: linear-gradient(180deg, rgba(22, 16, 15, 0.72), rgba(14, 13, 13, 0.96) 28%);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 14px 16px;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 6px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.24em;
      color: var(--text);
    }
    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }
    .cta-split {
      display: grid;
      grid-template-columns: 1fr 34px;
      gap: 2px;
    }
    .cta-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      height: 34px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
    }
    .cta-btn:first-child { border-radius: 7px 0 0 7px; }
    .cta-btn:last-child { border-radius: 0 7px 7px 0; font-size: 16px; }
    .cta-btn:hover { background: var(--accent-hover); }

    .nav { display: flex; flex-direction: column; gap: 3px; flex: 1; margin-top: 4px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 7px;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 500;
      text-align: left;
      transition: all 0.14s ease;
    }
    .nav-item svg { width: 15px; height: 15px; opacity: 0.78; flex-shrink: 0; }
    .nav-item:hover { color: var(--text-soft); background: rgba(255, 255, 255, 0.03); }
    .nav-item.active {
      color: var(--text);
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.02));
      border-color: var(--border-strong);
    }
    .nav-item.active svg { color: var(--text); opacity: 1; }
    .nav-badge {
      margin-left: auto;
      font-size: 10.5px;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #ff8e70;
      font-weight: 600;
    }

    .sidebar-foot {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .llm-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .llm-chip {
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid var(--border-strong);
      background: var(--card);
      color: var(--text-muted);
    }
    .llm-chip.live { border-color: rgba(34, 197, 94, 0.45); color: #86efac; }
    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.025);
    }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), #6b1d0b);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 11px;
    }
    .user-meta strong { display: block; font-size: 12px; font-weight: 600; }
    .user-meta span { font-size: 11px; color: var(--text-muted); }

    /* Main Content */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 18px 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .crumb { font-size: 11.5px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .page-title { font-size: 21px; font-weight: 600; letter-spacing: -0.015em; }
    .top-actions { display: flex; align-items: center; gap: 8px; }

    .btn-ghost {
      background: var(--card);
      color: var(--text-soft);
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-ghost:hover { background: var(--hover); color: var(--text); }
    .btn-ghost.active { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
    .btn-danger {
      background: var(--accent-soft);
      color: #ff8e72;
      border: 1px solid rgba(239, 70, 27, 0.45);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-danger:hover { background: var(--accent); color: #fff; }

    /* KPI Row */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 1120px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    .kpi-card {
      background: linear-gradient(180deg, rgba(29, 24, 23, 0.86), rgba(19, 17, 17, 0.94));
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
    }
    .kpi-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-soft); }
    .kpi-delta { font-size: 11px; color: var(--text-muted); }
    .kpi-body { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: 10px; }
    .kpi-num { font-size: 27px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
    .kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

    /* Dashboard 2-col */
    .dash-split {
      display: grid;
      grid-template-columns: 1.32fr 1fr;
      gap: 14px;
      flex: 1;
      min-height: 460px;
    }
    @media (max-width: 1150px) { .dash-split { grid-template-columns: 1fr; } }

    .card {
      background: linear-gradient(180deg, rgba(21, 19, 19, 0.92), rgba(16, 15, 15, 0.96));
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .card-title { font-size: 14px; font-weight: 500; color: var(--text); }
    .card-sub { font-size: 11.5px; color: var(--text-muted); }

    /* Threat Map */
    .map-stage {
      position: relative;
      flex: 1;
      min-height: 235px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .bar-list { display: flex; flex-direction: column; gap: 11px; padding-top: 4px; }
    .bar-row { display: grid; grid-template-columns: 42px 1fr 135px; align-items: center; gap: 12px; font-size: 11.5px; }
    .bar-val { font-family: "JetBrains Mono", monospace; color: var(--text); font-size: 11.5px; }
    .bar-track {
      height: 3px;
      background: repeating-linear-gradient(90deg, #332c2a 0 2px, transparent 2px 6px);
      position: relative;
    }
    .bar-fill {
      height: 3px;
      background: linear-gradient(90deg, #b82909, var(--accent));
      border-radius: 999px;
      box-shadow: 0 0 8px rgba(239, 70, 27, 0.45);
    }
    .bar-label { text-align: right; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }

    /* Activity Feed */
    .feed { display: flex; flex-direction: column; gap: 7px; overflow-y: auto; max-height: 440px; padding-right: 2px; }
    .feed-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(25, 22, 22, 0.88);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: border-color 0.14s ease, background 0.14s ease;
    }
    .feed-item:hover { border-color: var(--border-strong); background: var(--hover); }
    .feed-ico {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #1f1b1a;
      border: 1px solid var(--border-strong);
      display: grid;
      place-items: center;
      color: var(--text-soft);
      flex-shrink: 0;
    }
    .feed-ico.crit { color: #ff7a5c; border-color: rgba(239, 70, 27, 0.45); background: var(--accent-soft); }
    .feed-main { flex: 1; min-width: 0; }
    .feed-main strong { display: block; font-size: 12.5px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed-main span { font-size: 11px; color: var(--text-muted); }
    .feed-arrow { color: var(--text-muted); font-size: 13px; }

    /* Filter Bar */
    .filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .input-dark, .select-dark {
      background: var(--card);
      border: 1px solid var(--border-strong);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      outline: none;
    }
    .input-dark:focus, .select-dark:focus { border-color: var(--accent); }

    /* Kanban */
    .kanban { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; }
    .k-col {
      background: rgba(19, 17, 17, 0.78);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 360px;
    }
    .k-col-head { display: flex; align-items: center; gap: 7px; padding: 4px 4px 8px; font-size: 12.5px; font-weight: 600; color: var(--text-soft); }
    .k-card {
      background: var(--card-elev);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 12px;
      cursor: pointer;
      transition: border-color 0.14s ease, transform 0.12s ease;
    }
    .k-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .k-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
    .k-id { font-family: "JetBrains Mono", monospace; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .k-asset { font-size: 11.5px; color: var(--text-muted); margin-bottom: 10px; }
    .k-foot { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted); }
    .assignee { width: 22px; height: 22px; border-radius: 5px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }

    /* Tables */
    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 10px 16px; font-size: 10.5px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted);
      border-bottom: 1px solid var(--border); background: rgba(255, 255, 255, 0.015);
    }
    td { padding: 11px 16px; border-bottom: 1px solid var(--border); color: var(--text-soft); font-size: 12.5px; }
    tr.click-row { cursor: pointer; }
    tr.click-row:hover td { background: var(--hover); }
    code { font-family: "JetBrains Mono", monospace; font-size: 11.5px; color: var(--text); }

    .sev-dot { width: 7px; height: 7px; border-radius: 2px; display: inline-block; margin-right: 6px; }
    .sev-critical .sev-dot { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
    .sev-high .sev-dot { background: var(--accent); }
    .sev-medium .sev-dot { background: var(--amber); }
    .sev-low .sev-dot { background: var(--green); }

    .pill-status {
      display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px;
      border-radius: 999px; font-size: 11px; font-weight: 500;
      border: 1px solid var(--border-strong); background: var(--card);
    }
    .pill-status.isolated, .pill-status.DENY { border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; background: var(--red-soft); }
    .pill-status.healthy, .pill-status.mitigated, .pill-status.resolved, .pill-status.ALLOW { border-color: rgba(34, 197, 94, 0.45); color: #86efac; background: var(--green-soft); }
    .pill-status.alerting, .pill-status.open, .pill-status.investigating { border-color: rgba(230, 138, 46, 0.45); color: #fcd34d; background: var(--amber-soft); }

    /* Incident Details */
    .inc-banner { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; }
    .inc-banner-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .inc-meta { display: flex; flex-wrap: wrap; gap: 24px; }
    .inc-meta label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }
    .inc-meta span { font-size: 12.5px; color: var(--text); font-weight: 500; }
    .subtabs { display: flex; gap: 6px; padding-top: 12px; flex-wrap: wrap; }
    .subtab { padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text-muted); background: transparent; border: none; }
    .subtab.active { background: var(--text); color: #0a0909; font-weight: 600; }
    .inc-grid { display: grid; grid-template-columns: 0.9fr 1.35fr; gap: 14px; }
    @media (max-width: 1050px) { .inc-grid { grid-template-columns: 1fr; } }
    .kv-list { display: flex; flex-direction: column; gap: 10px; }
    .kv-row { display: flex; justify-content: space-between; font-size: 12.5px; padding-bottom: 7px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .kv-row span:first-child { color: var(--text-muted); }

    .empty-sphere {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 46px 20px; text-align: center; gap: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    }
    .tl-list { display: flex; flex-direction: column; gap: 10px; border-left: 2px solid var(--border-strong); padding-left: 16px; }
    .tl-card { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; }
    .tl-card::before { content: ""; position: absolute; left: -22px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
    .tl-card pre { margin-top: 8px; padding: 8px; border-radius: 6px; background: #0d0c0c; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--text-soft); overflow-x: auto; }

    /* CERBERUS command-center refinement */
    :root {
      --bg:#090b0e; --sidebar:#0d1014; --surface:#10151b; --card:#131920;
      --card-elev:#171f27; --hover:#1b252e; --border:#202a33; --border-strong:#34414c;
      --text:#f2f5f7; --text-soft:#b6c0c8; --text-muted:#7d8a95;
      --accent:#ff593d; --accent-hover:#ff755c; --accent-soft:rgba(255,89,61,.12);
      --green:#40d49b; --green-soft:rgba(64,212,155,.12); --amber:#f2b45f;
      --amber-soft:rgba(242,180,95,.12); --red:#ff626c; --red-soft:rgba(255,98,108,.12);
    }
    body { background:radial-gradient(ellipse 80% 32% at 62% -12%,rgba(255,89,61,.13),transparent 70%),linear-gradient(120deg,#0a0e12,#090b0e 45%); }
    .sidebar { width:246px; padding:24px 16px 18px; gap:20px; background:rgba(12,16,20,.92); border-color:#1c252d; }
    .brand { font-size:14px; letter-spacing:.2em; padding:3px 8px 10px; }
    .brand::before { content:""; width:28px;height:28px;margin-right:10px;border-radius:8px;display:inline-block; background:linear-gradient(145deg,#ff7655,#a62d22); box-shadow:0 5px 18px rgba(255,89,61,.2); }
    .brand span:first-child { margin-right:auto; }
    .brand-dot { width:8px;height:8px; }
    .cta-btn { border-radius:7px!important; height:38px; font-weight:600; box-shadow:0 6px 18px rgba(255,89,61,.12); }
    .cta-split { grid-template-columns:1fr 38px; gap:6px; }
    .nav { gap:5px; margin-top:0; }
    .nav-item { padding:10px 12px; gap:12px; border-radius:8px; font-size:13px; }
    .nav-item.active { background:linear-gradient(90deg,rgba(255,89,61,.14),rgba(255,89,61,.035));border-color:rgba(255,89,61,.20);box-shadow:inset 2px 0 #ff6547; }
    .nav-item.active svg { color:#ff8a70; }
    .sidebar-foot { padding:16px 4px 0; gap:14px; }
    .user-card { padding:9px; background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.045); }
    .avatar { width:32px;height:32px;border-radius:9px; }
    .main { padding:28px clamp(20px,3vw,46px) 38px; gap:20px; }
    .topbar { min-height:52px; }
    .crumb { text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:600; }
    .page-title { font-size:25px;letter-spacing:-.04em;font-weight:650; }
    .btn-ghost,.select-dark,.input-dark { border-radius:8px; }
    .btn-ghost { padding:8px 13px; }
    .kpi-grid { gap:14px; }
    .kpi-card,.card,.table-wrap,.inc-banner { border-radius:12px;border-color:#202a33; box-shadow:0 12px 32px rgba(0,0,0,.12); }
    .kpi-card { padding:17px 18px; min-height:126px; background:linear-gradient(145deg,rgba(24,32,40,.94),rgba(16,21,27,.96)); position:relative;overflow:hidden; }
    .kpi-card::after { content:"";position:absolute;inset:auto -20px -46px auto;width:118px;height:118px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.035),transparent 70%);pointer-events:none; }
    .kpi-head { font-size:12px;font-weight:550; }
    .kpi-delta { color:#8d9aa4; }
    .kpi-num { font-size:31px;letter-spacing:-.045em; }
    .kpi-sub { margin-top:8px; }
    .dash-split { gap:16px; min-height:440px; }
    .card { padding:19px 20px; background:linear-gradient(155deg,rgba(19,26,33,.96),rgba(14,19,24,.98)); }
    .card-head { margin-bottom:16px; }
    .card-title { font-size:14px;font-weight:620;letter-spacing:-.01em; }
    .card-sub { font-size:11px; }
    .map-stage { min-height:240px; border-radius:9px;background:radial-gradient(ellipse at 50% 48%,rgba(36,52,62,.18),transparent 68%); }
    .bar-list { gap:13px; }
    .bar-track { height:4px;border-radius:99px;background:#26313a;overflow:hidden; }
    .bar-fill { height:4px;background:linear-gradient(90deg,#b63a2b,#ff7655);box-shadow:none; }
    .bar-row { grid-template-columns:48px 1fr minmax(95px,150px); }
    .feed { gap:8px; }
    .feed-item { padding:11px 12px; border-radius:9px;background:rgba(255,255,255,.018); }
    .feed-ico { border-radius:8px; }
    .kanban { gap:14px; }
    .k-col { border-radius:11px;background:rgba(16,21,27,.8); }
    .k-card { border-radius:9px; }
    .table-wrap { overflow:auto; }
    th { background:#131a20; }
    tbody tr:last-child td { border-bottom:0; }
    td { padding-top:13px;padding-bottom:13px; }
    .pill-status { text-transform:capitalize; }
    .command-intro { display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:4px 0 2px; }
    .command-eyebrow { color:#ff8a70;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;margin-bottom:7px; }
    .command-title { font-size:27px;line-height:1.15;letter-spacing:-.045em;font-weight:650; }

<body>

        Dashboard
      </button>
      <button class="nav-item" data-view="findings" onclick="setView('findings')">

        Findings
        <span class="nav-badge" id="nav-open-badge">0</span>
      </button>
      <button class="nav-item" data-view="incidents" onclick="setView('incidents')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15h6"/></svg>
        Incidents
      </button>
      <button class="nav-item" data-view="devices" onclick="setView('devices')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg>
        Devices
      </button>
      <button class="nav-item" data-view="isolations" onclick="setView('isolations')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Isolations
      </button>
      <button class="nav-item" data-view="audit" onclick="setView('audit')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        Policy Audit
      </button>

    <div class="sidebar-foot">
      <div class="llm-row">
        <span class="llm-chip" id="groq-chip">Groq: --</span>
        <span class="llm-chip" id="ds-chip">DeepSeek: --</span>
      </div>
      <div class="user-card">
        <div class="avatar">C3</div>
        <div class="user-meta">
          <strong>SOC Operator</strong>
          <span>@cerberus-lab</span>
        </div>
      </div>
    </div>
  </aside>

  <main class="main" id="main-root"></main>

  <script>
    let currentView = "dashboard";
    let findingsMode = "kanban";
    let selectedIncidentId = null;
    let incidentTab = "overview";
    let filters = { q: "", severity: "" };
    let feedSort = "latest";

    let state = {
      health: { llm_mode: { groq: "fallback", deepseek: "fallback" } },
      kpis: {},
      devices: [],
      incidents: [],
      isolations: [],
      audit: [],
    };

    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function relTime(iso) {
      if (!iso) return "just now";
      const sec = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 1000));
      if (Number.isNaN(sec)) return String(iso).slice(0, 16);
      if (sec < 60) return `${sec}s ago`;
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min}m ago`;
      const hr = Math.floor(min / 60);
      if (hr < 24) return `${hr}h ago`;
      return `${Math.floor(hr / 24)}d ago`;
    }

    async function loadHealth() {
      const h = await fetch("/api/health").then((r) => r.json());
      state.health = h;
      const g = document.getElementById("groq-chip");
      const d = document.getElementById("ds-chip");
      g.textContent = `Groq: ${h.llm_mode.groq}`;
      d.textContent = `DeepSeek: ${h.llm_mode.deepseek}`;
      g.classList.toggle("live", h.llm_mode.groq === "live");
      d.classList.toggle("live", h.llm_mode.deepseek === "live");
    }

    async function refreshAll() {
      const [ov, inc, iso, aud] = await Promise.all([
        fetch("/api/overview").then((r) => r.json()),
        fetch("/api/incidents").then((r) => r.json()),
        fetch("/api/isolations").then((r) => r.json()),
        fetch("/api/audit").then((r) => r.json()),
      ]);
      state.kpis = ov.kpis;
      state.devices = ov.devices;
      state.incidents = inc.incidents;
      state.isolations = iso.isolations;
      state.audit = aud.audit;
      document.getElementById("nav-open-badge").textContent = ov.kpis.open_incidents ?? 0;
      render();
    }

    function setView(v) {
      currentView = v;
      if (v === "incidents" && !selectedIncidentId && state.incidents.length) {
        selectedIncidentId = state.incidents[0].id;
      }
      document.querySelectorAll(".nav-item[data-view]").forEach((el) => {
        el.classList.toggle("active", el.dataset.view === v);
      });
      render();
    }

    async function openIncidentDetail(id) {
      selectedIncidentId = id;
      currentView = "incidents";
      document.querySelectorAll(".nav-item[data-view]").forEach((el) => {
        el.classList.toggle("active", el.dataset.view === "incidents");
      });
      const detail = await fetch(`/api/incidents/${encodeURIComponent(id)}`).then((r) => r.json());
      state.selectedIncident = detail;
      render();
    }

    async function releaseDevice(deviceId, incidentId) {
      const qs = incidentId ? `?incident_id=${encodeURIComponent(incidentId)}` : "";
      await fetch(`/api/isolations/${encodeURIComponent(deviceId)}/release${qs}`, { method: "POST" });
      await refreshAll();
      if (selectedIncidentId) await openIncidentDetail(selectedIncidentId);
    }

    function exportIncidentsCsv() {
      const cols = ["id", "device_id", "severity", "status", "detection_ref", "decision", "outcome", "updated_utc"];
      const lines = [cols.join(",")].concat(
        state.incidents.map((i) => cols.map((c) => `"${String(i[c] ?? "").replace(/"/g, '""')}"`).join(","))
      );
      const blob = new Blob([lines.join("\n")], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "cerberus_findings.csv";
      a.click();
    }

    function biWaveformSvg(color = "#22c55e") {
      const vals = [7, 11, 6, 13, 9, 15, 11, 16, 12, 8, 14, 10, 15, 9, 12];
      return `<svg width="106" height="36" viewBox="0 0 106 36">
        <line x1="0" y1="18" x2="106" y2="18" stroke="#2c2624" stroke-width="1"/>
        ${vals.map((v, i) => `<rect x="${i * 7 + 1}" y="${18 - v}" width="3" height="${v * 2}" rx="1.5" fill="${color}" opacity="${0.55 + (i % 3) * 0.15}"/>`).join("")}
      </svg>`;
    }

    function tickedRingSvg(pct = 40, color = "#e68a2e") {
      const r = 16, c = 2 * Math.PI * r;
      const dash = (Math.max(0, Math.min(100, pct)) / 100) * c;
      return `<svg width="46" height="46" viewBox="0 0 46 46">
        <circle cx="23" cy="23" r="20" fill="none" stroke="#302927" stroke-width="2" stroke-dasharray="1.5 3"/>
        <circle cx="23" cy="23" r="${r}" fill="none" stroke="#26211f" stroke-width="3.5"/>
        <circle cx="23" cy="23" r="${r}" fill="none" stroke="${color}" stroke-width="3.5" stroke-dasharray="${dash} ${c}" stroke-linecap="round" transform="rotate(-90 23 23)"/>
        <text x="23" y="26" text-anchor="middle" fill="#f3efed" font-size="9.5" font-weight="600">${Math.round(pct)}%</text>
      </svg>`;
    }

    function tickedArcGaugeSvg(pct = 80) {
      return `<svg width="82" height="42" viewBox="0 0 82 42">
        <path d="M 8 36 A 32 32 0 0 1 74 36" fill="none" stroke="#2e2826" stroke-width="5" stroke-dasharray="2 3"/>
        <path d="M 8 36 A 32 32 0 0 1 74 36" fill="none" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="${(pct / 100) * 101} 101"/>
      </svg>`;
    }

    function worldThreatMapSvg() {
      // Stylized global network visualization. Node placement is illustrative because the API has no geo coordinates.
      const nodes = [[168,146],[345,124],[505,160],[680,133],[850,180],[950,110]];
      const paths = [[nodes[0],nodes[1]],[nodes[1],nodes[2]],[nodes[2],nodes[3]],[nodes[3],nodes[4]],[nodes[2],nodes[5]],[nodes[0],nodes[4]]];
      const continents = [
        'M95 119l28-21 35 4 20 15 36 7 24 23-8 19-29 2-11 21-24 7-12 37-19-10-8-36-18-20-29-8-17-20z',
        'M207 222l24 11 18 30-7 32-15 34-14-16-5-34-13-25z',
        'M442 119l22-17 35 6 15 17-10 17-27-1-19 10-23-11z',
        'M480 156l32-14 43 6 30 21-9 22-28 8-12 27-19 26-20-10-8-30-24-20z',
        'M579 123l31-15 45 7 25 17 48-7 29 20-7 17-42 4-30 21-24-7-22 19-35-8-9-24-24-13z',
        'M685 211l25 6 17 21-6 30-23 13-19-26z',
        'M823 156l26-15 29 6 14 19-16 12-32-3z'
      ];
      const activity = state.devices.reduce((sum,d)=>sum+(Number(d.event_count)||0),0);
      return `<svg class="threat-svg" viewBox="0 0 1100 390" role="img" aria-label="Illustrative global network activity map">
        <defs>
          <radialGradient id="mapGlow"><stop stop-color="#ff3d32" stop-opacity=".34"/><stop offset="1" stop-color="#ff3d32" stop-opacity="0"/></radialGradient>
          <linearGradient id="routeGlow"><stop stop-color="#ff9a67" stop-opacity=".15"/><stop offset=".5" stop-color="#ff493b"/><stop offset="1" stop-color="#ffb06c" stop-opacity=".3"/></linearGradient>
          <filter id="softGlow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <pattern id="mapGrid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#19303b" stroke-opacity=".24" stroke-width=".7"/></pattern>
        </defs>
        <rect width="1100" height="390" fill="url(#mapGrid)"/>
        <g fill="none" stroke="#26333b" stroke-width=".8" opacity=".72"><path d="M0 195H1100M550 0V390"/><ellipse cx="550" cy="195" rx="450" ry="150"/><ellipse cx="550" cy="195" rx="300" ry="150"/><ellipse cx="550" cy="195" rx="150" ry="150"/></g>
        <g fill="#18242a" stroke="#2c3c43" stroke-width="1.2" opacity=".94">${continents.map(d=>`<path d="${d}"/>`).join('')}</g>
        <g fill="#31434a" opacity=".72">${continents.map((_,i)=>`<circle cx="${140+i*129}" cy="${120+(i%3)*45}" r="2"/>`).join('')}</g>
        <g class="route-lines">${paths.map(([a,b],i)=>{const mx=(a[0]+b[0])/2,my=Math.min(a[1],b[1])-55-(i%2)*25;return `<path class="route-path route-${i}" d="M${a[0]} ${a[1]} Q${mx} ${my} ${b[0]} ${b[1]}"/>`}).join('')}</g>
        ${nodes.map(([x,y],i)=>`<g class="map-node node-${i}" transform="translate(${x} ${y})"><circle class="node-halo" r="31" fill="url(#mapGlow)"/><circle class="node-ring" r="12"/><circle class="node-core" r="4"/><circle class="node-pulse" r="12"/><text x="0" y="31" text-anchor="middle" class="node-label">${`NODE 0${i+1}`}</text></g>`).join('')}
        <g class="map-scan"><path d="M0 0V390"/></g>
      </svg>`;
    }

    function wireframeSphereSvg() {
      return `<svg width="170" height="170" viewBox="0 0 180 180">
        <defs><radialGradient id="sg" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#ef461b" stop-opacity="0.25"/><stop offset="100%" stop-color="#ef461b" stop-opacity="0"/></radialGradient></defs>
        <circle cx="90" cy="90" r="76" fill="url(#sg)"/>
        ${[-45,-25,0,25,45].map((dy) => `<ellipse cx="90" cy="${90+dy}" rx="${Math.sqrt(Math.max(0, 66*66 - dy*dy))}" ry="${Math.max(6, Math.sqrt(Math.max(0, 66*66 - dy*dy))*0.28)}" fill="none" stroke="#ef461b" stroke-opacity="0.45" stroke-width="0.9"/>`).join("")}
        ${[0,30,60,90,120,150].map((deg) => `<ellipse cx="90" cy="90" rx="28" ry="66" fill="none" stroke="#ef461b" stroke-opacity="0.4" stroke-width="0.9" transform="rotate(${deg} 90 90)"/>`).join("")}
        <circle cx="90" cy="90" r="66" fill="none" stroke="#ef461b" stroke-opacity="0.7" stroke-width="1.2"/>
      </svg>`;
    }

    function radarSvg(inc) {
      const axes = ["Rate Spike", "Payload Size", "Topic Entropy", "Gap Drift", "Device Drift", "Policy Risk"];
      const cx = 140, cy = 110, R = 74;
      const obs = inc.severity === "critical" ? [0.92, 0.78, 0.72, 0.85, 0.90, 0.88] : inc.severity === "high" ? [0.85, 0.65, 0.6, 0.72, 0.8, 0.7] : [0.55, 0.45, 0.4, 0.5, 0.55, 0.42];
      const exp = [0.28, 0.25, 0.22, 0.26, 0.24, 0.2];
      const pts = (vals) => vals.map((v, i) => {
        const a = (Math.PI * 2 * i) / axes.length - Math.PI / 2;
        return `${cx + Math.cos(a) * R * v},${cy + Math.sin(a) * R * v}`;
      }).join(" ");
      return `<svg viewBox="0 0 280 225" width="100%" height="215">
        ${[0.33, 0.66, 1].map((s) => `<polygon points="${pts(axes.map(() => s))}" fill="none" stroke="#2d2725" stroke-width="1"/>`).join("")}
        ${axes.map((lbl, i) => {
          const a = (Math.PI * 2 * i) / axes.length - Math.PI / 2;
          const x = cx + Math.cos(a) * (R + 18), y = cy + Math.sin(a) * (R + 14);
          return `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(a)*R}" y2="${cy + Math.sin(a)*R}" stroke="#2d2725" stroke-width="1"/>
                  <text x="${x}" y="${y}" text-anchor="middle" fill="#8b827d" font-size="9.5">${lbl}</text>`;
        }).join("")}
        <polygon points="${pts(exp)}" fill="rgba(230, 138, 46, 0.16)" stroke="#e68a2e" stroke-width="1.5"/>
        <polygon points="${pts(obs)}" fill="rgba(239, 70, 27, 0.28)" stroke="#ef461b" stroke-width="2"/>
      </svg>`;
    }

    function renderDashboard() {
      const k = state.kpis;
      const totalDevs = Math.max(1, k.devices_total || 5);
      const healthyPct = Math.round(((totalDevs - (k.devices_isolated || 0)) / totalDevs) * 100);
      const activePct = Math.min(100, Math.round(((k.open_incidents || 0) / Math.max(1, state.incidents.length)) * 100));
      const maxEvents = Math.max(1, ...state.devices.map((d) => d.event_count || 0));
      const activity = state.devices.reduce((sum, d) => sum + (Number(d.event_count) || 0), 0);

      let feedItems = [
        ...state.incidents.slice(0, 6).map((i) => ({
          id: i.id,
          crit: i.severity === "high" || i.severity === "critical",
          title: `${i.severity === "critical" || i.severity === "high" ? "Critical anomaly detected" : "Finding opened"} on ${i.device_id}`,
          sub: `${i.decision || i.detection_ref} · ${relTime(i.updated_utc)}`,
          ts: i.updated_utc || "",
        })),
        ...state.audit.slice(0, 6).map((a) => ({
          id: null,
          crit: a.verdict === "DENY",
          title: `Policy ${a.verdict === "DENY" ? "blocked" : "authorized"}: "${a.action}"`,
          sub: `${a.actor} on ${a.target} · ${relTime(a.ts_utc)}`,
          ts: a.ts_utc || "",
        })),
      ];
      if (feedSort === "critical") {
        feedItems.sort((a, b) => Number(b.crit) - Number(a.crit));
      } else {
        feedItems.sort((a, b) => b.ts.localeCompare(a.ts));
      }
      feedItems = feedItems.slice(0, 9);

      return `
        <section class="command-intro">
          <div><div class="command-eyebrow"><i></i> SECURITY OPERATIONS <span>/</span> WATCHFLOOR 01</div><h1 class="command-title">Threat watch<span> / global overview</span></h1><p class="command-copy">Live telemetry, incident triage, and response posture across the monitored fleet.</p></div>
          <div class="command-status"><i></i><span><b>LIVE FEED</b><small> · telemetry stream</small></span></div>
        </section>
        <section class="card threat-card">
          <div class="card-head threat-head"><div><div class="map-index">01 <span>/</span> NETWORK SURFACE</div><div class="card-title">Threat activity</div><div class="card-sub">Fleet topology · live event paths</div></div><div class="map-legend"><span><i class="legend-hot"></i> Active signal</span><span><i class="legend-route"></i> Traffic path</span></div></div>
          <div class="map-stage cinematic-map">${worldThreatMapSvg()}<div class="map-overlay map-overlay-left"><span class="map-overline">LIVE NETWORK</span><strong>${k.devices_total ?? state.devices.length} <small>nodes monitored</small></strong><span class="map-caption">${k.open_incidents ?? 0} priority signals · ${k.devices_isolated ?? 0} isolated</span></div><div class="map-overlay map-overlay-right"><span>GLOBAL EVENT VOLUME</span><strong>${k.total_events ?? 0}</strong><small>${activity.toLocaleString()} events across listed nodes</small></div><div class="map-footnote">Illustrative topology · node positions are not geographic attribution</div></div>
          <div class="map-bottom"><span class="stream-indicator"><i></i> STREAM ACTIVE</span><span>${state.devices.length} endpoints · ${k.total_events ?? 0} events observed</span><button class="btn-ghost map-refresh" onclick="refreshAll()">Refresh telemetry <span>↻</span></button></div>
        </section>
        <section class="kpi-grid">
          <div class="kpi-card"><div class="kpi-head"><span>MQTT events</span><span class="kpi-delta">↗ live</span></div><div class="kpi-body"><div><div class="kpi-num">${k.total_events ?? 0}</div><div class="kpi-sub">${k.devices_total ?? 0} monitored nodes</div></div>${biWaveformSvg("#40d49b")}</div></div>
          <div class="kpi-card"><div class="kpi-head"><span>Active incidents</span><span class="kpi-delta">${k.mitigated_incidents ?? 0} mitigated</span></div><div class="kpi-body"><div><div class="kpi-num">${k.open_incidents ?? 0}</div><div class="kpi-sub">${state.incidents.length} total recorded</div></div>${tickedRingSvg(activePct, "#f2b45f")}</div></div>
          <div class="kpi-card"><div class="kpi-head"><span>Fleet health</span><span class="kpi-delta">${k.devices_isolated ?? 0} isolated</span></div><div class="kpi-body"><div><div class="kpi-num">${healthyPct}%</div><div class="kpi-sub">active lab coverage</div></div>${tickedArcGaugeSvg(healthyPct)}</div></div>
          <div class="kpi-card"><div class="kpi-head"><span>Policy blocks</span><span class="kpi-delta">PolicyGate</span></div><div class="kpi-body"><div><div class="kpi-num">${k.policy_denies ?? 0}</div><div class="kpi-sub">${k.active_isolations ?? 0} active isolations</div></div>${biWaveformSvg("#f2b45f")}</div></div>
        </section>
        <section class="lower-grid">
          <div class="card activity-card"><div class="card-head"><div><div class="panel-index">02 <span>/</span> EVENT STREAM</div><div class="card-title">Recent activity</div><div class="card-sub">Chronological signals from policy and detection</div></div><select class="select-dark" style="padding:6px 9px;font-size:11px" onchange="feedSort=this.value;render()"><option value="latest" ${feedSort==='latest'?'selected':''}>Latest first</option><option value="critical" ${feedSort==='critical'?'selected':''}>Critical first</option></select></div><div class="feed">${feedItems.length ? feedItems.map((f) => `<div class="feed-item" ${f.id ? `onclick="openIncidentDetail('${esc(f.id)}')"` : `onclick="setView('audit')"`}><div class="feed-ico ${f.crit ? 'crit' : ''}">${f.crit ? '!' : '&bull;'}</div><div class="feed-main"><strong>${esc(f.title)}</strong><span>${esc(f.sub)}</span></div><span class="feed-arrow">↗</span></div>`).join("") : `<div class="empty-feed"><span class="empty-feed-mark">◌</span><strong>No activity yet</strong><span>Events will appear here as telemetry arrives.</span></div>`}</div></div>
          <div class="card highlight-card"><div class="card-head"><div><div class="panel-index">03 <span>/</span> RESPONSE QUEUE</div><div class="card-title">Priority incidents</div><div class="card-sub">Highest-severity items requiring attention</div></div><button class="text-link" onclick="setView('findings')">All findings <span>↗</span></button></div><div class="incident-highlights">${state.incidents.slice().sort((a,b)=>({critical:0,high:1,medium:2,low:3}[a.severity]??4)-({critical:0,high:1,medium:2,low:3}[b.severity]??4)).slice(0,4).map(i=>`<button class="highlight-item" onclick="openIncidentDetail('${esc(i.id)}')"><span class="severity-mark sev-${esc(i.severity)}"></span><span class="highlight-copy"><strong>${esc(i.device_id)}</strong><small>${esc(i.id)} · ${esc(i.decision || i.detection_ref || 'Finding')}</small></span><span class="highlight-meta"><b class="severity-label ${esc(i.severity)}">${esc(i.severity)}</b><small>${esc(relTime(i.updated_utc))}</small></span><span class="highlight-arrow">›</span></button>`).join('') || `<div class="empty-feed"><span class="empty-feed-mark">✓</span><strong>All clear</strong><span>No incident highlights right now.</span></div>`}</div></div>
        </section>
      `;
    }

    function renderFindings() {
      const q = filters.q.toLowerCase();
      const sev = filters.severity;
      const rows = state.incidents.filter((i) =>
        (!sev || i.severity === sev) &&
        (!q || i.device_id.toLowerCase().includes(q) || i.id.toLowerCase().includes(q) || (i.reasoning_summary || "").toLowerCase().includes(q))
      );

      const cols = [
        { key: "open", label: "Open", dot: "#b6aeaa" },
        { key: "investigating", label: "Investigating", dot: "#e68a2e" },
        { key: "mitigated", label: "Mitigated", dot: "#ef461b" },
        { key: "resolved", label: "Resolved", dot: "#22c55e" },
      ];

      let body = "";
      if (!rows.length) {
        body = `<div class="empty-sphere">
          ${wireframeSphereSvg()}
          <strong style="font-size:15px">Nice, no findings match these filters!</strong>
          <span style="color:var(--text-muted)">Clear your search filter or run a lab anomaly check to generate findings.</span>
          <button class="cta-btn" style="padding:0 16px;border-radius:7px" onclick="filters={q:'',severity:''};render()">Reset filters</button>
        </div>`;
      } else if (findingsMode === "kanban") {
        body = `<div class="kanban">${cols.map((c) => {
          const items = rows.filter((r) => r.status === c.key);
          return `<div class="k-col">
            <div class="k-col-head"><span class="sev-dot" style="background:${c.dot}"></span>${c.label} (${items.length})</div>
            ${items.map((i) => `
              <div class="k-card sev-${esc(i.severity)}" onclick="openIncidentDetail('${esc(i.id)}')">
                <div class="k-top">
                  <span class="k-id"><span class="sev-dot"></span>${esc(i.id)}</span>
                  <span style="font-size:10.5px;color:var(--text-muted)">${esc(i.severity)}</span>
                </div>
                <div class="k-asset">${esc(i.device_id)} &middot; ${esc(i.decision || i.detection_ref)}</div>
                <div class="k-foot">
                  <span>${esc((i.updated_utc || "").slice(0, 10))}</span>
                  <span class="assignee">AI</span>
                </div>
              </div>
            `).join("")}
          </div>`;
        }).join("")}</div>`;
      } else {
        body = `<div class="table-wrap"><table>
          <thead><tr><th>ID</th><th>Severity</th><th>Asset</th><th>Decision</th><th>Status</th><th>Updated</th></tr></thead>
          <tbody>${rows.map((i) => `
            <tr class="click-row sev-${esc(i.severity)}" onclick="openIncidentDetail('${esc(i.id)}')">
              <td><code>${esc(i.id)}</code></td>
              <td><span class="sev-dot"></span>${esc(i.severity)}</td>
              <td>${esc(i.device_id)}</td>
              <td>${esc(i.decision || i.detection_ref)}</td>
              <td><span class="pill-status ${esc(i.status)}">${esc(i.status)}</span></td>
              <td>${esc(relTime(i.updated_utc))}</td>
            </tr>
          `).join("")}</tbody>
        </table></div>`;
      }

      return `
        <div class="topbar">
          <div>
            <div class="crumb">Home <span>&rsaquo;</span> Findings</div>
            <h1 class="page-title">Findings</h1>
          </div>
          <div class="top-actions">
            <button class="btn-ghost ${findingsMode === 'table' ? 'active' : ''}" onclick="findingsMode='table';render()">List</button>
            <button class="btn-ghost ${findingsMode === 'kanban' ? 'active' : ''}" onclick="findingsMode='kanban';render()">Kanban</button>
            <button class="btn-ghost" onclick="exportIncidentsCsv()">Export</button>
          </div>
        </div>
        <div class="filter-bar">
          <input class="input-dark" id="findings-search" placeholder="Filter device, ID, summary..." value="${esc(filters.q)}" oninput="filters.q=this.value;render()" />
          <select class="select-dark" onchange="filters.severity=this.value;render()">
            <option value="">All severities</option>
            <option value="critical" ${filters.severity==='critical'?'selected':''}>Critical</option>
            <option value="high" ${filters.severity==='high'?'selected':''}>High</option>
            <option value="medium" ${filters.severity==='medium'?'selected':''}>Medium</option>
            <option value="low" ${filters.severity==='low'?'selected':''}>Low</option>
          </select>
        </div>
        ${body}
      `;
    }

    function renderIncidentDetail() {
      const inc = state.selectedIncident || state.incidents[0];
      if (!inc) {
        return `<div class="topbar"><div><div class="crumb">Home &rsaquo; Incidents</div><h1 class="page-title">Incidents</h1></div></div>
        <div class="empty-sphere">${wireframeSphereSvg()}<strong>No incidents recorded yet</strong><span style="color:var(--text-muted)">Incidents opened by the Defense Agent or Fallback engine appear here.</span></div>`;
      }
      const timeline = inc.timeline || [];
      const dev = state.devices.find((d) => d.device_id === inc.device_id) || { device_id: inc.device_id, ip: "-", status: inc.status };

      let tabBody = "";
      if (incidentTab === "overview") {
        tabBody = `
          <div class="inc-grid">
            <div class="card">
              <div class="card-head"><div class="card-title">Information</div></div>
              <div class="kv-list">
                <div class="kv-row"><span>Device ID</span><strong>${esc(inc.device_id)}</strong></div>
                <div class="kv-row"><span>Status</span><span class="pill-status ${esc(inc.status)}">${esc(inc.status)}</span></div>
                <div class="kv-row"><span>Detection Ref</span><code>${esc(inc.detection_ref)}</code></div>
                <div class="kv-row"><span>Decision</span><span>${esc(inc.decision || "-")}</span></div>
                <div class="kv-row"><span>Action / Outcome</span><span>${esc(inc.action || "-")} / ${esc(inc.outcome || "-")}</span></div>
                <div class="kv-row"><span>Timeline Events</span><span>${timeline.length}</span></div>
              </div>
              <div style="margin-top:14px">
                <div class="card-sub" style="margin-bottom:4px">Reasoning Summary</div>
                <div style="color:var(--text-soft);font-size:12.5px">${esc(inc.reasoning_summary || "No summary recorded yet.")}</div>
              </div>
            </div>
            <div class="card">
              <div class="card-head">
                <div class="card-title">Threat Surface Map</div>
                <div class="card-sub"><span style="color:#ef461b">Observed</span> &middot; <span style="color:#e68a2e">Expected</span></div>
              </div>
              ${radarSvg(inc)}
            </div>
          </div>
          <div class="card">
            <div class="card-head"><div class="card-title">Entities</div></div>
            <div class="table-wrap"><table>
              <thead><tr><th>Device</th><th>IP</th><th>Status</th><th>Action</th></tr></thead>
              <tbody><tr>
                <td><strong>${esc(dev.device_id)}</strong></td>
                <td><code>${esc(dev.ip || "-")}</code></td>
                <td><span class="pill-status ${esc(dev.status || inc.status)}">${esc(dev.status || inc.status)}</span></td>
                <td>${dev.status === 'isolated' ? `<button class="btn-danger" onclick="releaseDevice('${esc(dev.device_id)}','${esc(inc.id)}')">Release Device</button>` : "-"}</td>
              </tr></tbody>
            </table></div>
          </div>
        `;
      } else {
        tabBody = `<div class="card"><div class="card-head"><div class="card-title">Ordered Evidence Timeline (${timeline.length})</div></div>
          <div class="tl-list">${timeline.length ? timeline.map((t) => `
            <div class="tl-card">
              <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:4px">
                <strong style="color:var(--text)">${esc(t.kind)} &middot; ${esc(t.actor)}</strong>
                <span>${esc(relTime(t.ts_utc))}</span>
              </div>
              <div>${esc(t.summary)}</div>
              ${Object.keys(t.details || {}).length ? `<pre>${esc(JSON.stringify(t.details, null, 2))}</pre>` : ""}
            </div>`).join("") : `<span style="color:var(--text-muted)">Click an incident from Findings to load its full timeline.</span>`}
          </div></div>`;
      }

      return `
        <div class="topbar">
          <div>
            <div class="crumb">Home <span>&rsaquo;</span> Incidents <span>&rsaquo;</span> ${esc(inc.id)}</div>
            <h1 class="page-title">Incident details</h1>
          </div>
          <div class="top-actions">
            <button class="btn-ghost" onclick="exportIncidentsCsv()">Download report</button>
          </div>
        </div>

        <div class="inc-banner">
          <div class="inc-banner-top">
            <div><strong style="font-size:16px">${esc(inc.id)}</strong> <span style="color:var(--text-muted);margin-left:8px">${esc(inc.device_id)}</span></div>
            <div class="inc-meta">
              <div><label>Created</label><span>${esc((inc.created_utc || "").slice(0, 10))}</span></div>
              <div><label>Last Update</label><span>${esc(relTime(inc.updated_utc))}</span></div>
              <div><label>Status</label><span class="pill-status ${esc(inc.status)}">${esc(inc.status)}</span></div>
              <div><label>Severity</label><span class="pill-status sev-${esc(inc.severity)}"><span class="sev-dot"></span>${esc(inc.severity)}</span></div>
            </div>
          </div>
          <div class="subtabs">
            <button class="subtab ${incidentTab==='overview'?'active':''}" onclick="incidentTab='overview';render()">Overview</button>
            <button class="subtab ${incidentTab==='timeline'?'active':''}" onclick="incidentTab='timeline';render()">Timeline &amp; Logs (${timeline.length})</button>
          </div>
        </div>
        ${tabBody}
      `;
    }

    function renderDevices() {
      return `
        <div class="topbar"><div><div class="crumb">Home &rsaquo; Devices</div><h1 class="page-title">IoT Device Fleet</h1></div></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Device ID</th><th>Type</th><th>Room</th><th>IP</th><th>Status</th><th>Events</th><th>Open</th></tr></thead>
          <tbody>${state.devices.map((d) => `
            <tr>
              <td><strong>${esc(d.device_id)}</strong></td>
              <td>${esc(d.device_type)}</td>
              <td>${esc(d.room)}</td>
              <td><code>${esc(d.ip)}</code></td>
              <td><span class="pill-status ${esc(d.status)}">${esc(d.status)}</span></td>
              <td>${d.event_count}</td>
              <td>${d.open_incidents}</td>
            </tr>`).join("")}
          </tbody>
        </table></div>`;
    }

    function renderIsolations() {
      return `
        <div class="topbar"><div><div class="crumb">Home &rsaquo; Isolations</div><h1 class="page-title">Device Isolations</h1></div></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Device</th><th>Status</th><th>Actor</th><th>Reason</th><th>Started</th><th>Action</th></tr></thead>
          <tbody>${state.isolations.length ? state.isolations.map((x) => `
            <tr>
              <td><strong>${esc(x.device_id)}</strong></td>
              <td><span class="pill-status ${x.status==='active'?'isolated':'resolved'}">${esc(x.status)}</span></td>
              <td>${esc(x.actor)}</td>
              <td>${esc(x.reason)}</td>
              <td>${esc(relTime(x.started_utc))}</td>
              <td>${x.status==='active' ? `<button class="btn-danger" onclick="releaseDevice('${esc(x.device_id)}','${esc(x.incident_id||'')}')">Release</button>` : "-"}</td>
            </tr>`).join("") : `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:28px">No isolations recorded yet.</td></tr>`}
          </tbody>
        </table></div>`;
    }

    function renderAudit() {
      return `
        <div class="topbar"><div><div class="crumb">Home &rsaquo; Policy Audit</div><h1 class="page-title">Policy Gate Audit Log</h1></div></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Verdict</th><th>Reason</th></tr></thead>
          <tbody>${state.audit.length ? state.audit.map((a) => `
            <tr>
              <td>${esc(relTime(a.ts_utc))}</td>
              <td>${esc(a.actor)}</td>
              <td><code>${esc(a.action)}</code></td>
              <td>${esc(a.target)}</td>
              <td><span class="pill-status ${esc(a.verdict)}">${esc(a.verdict)}</span></td>
              <td>${esc(a.reason)}</td>
            </tr>`).join("") : `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:28px">No policy audit entries yet.</td></tr>`}
          </tbody>
        </table></div>`;
    }

    function render() {
      const activeEl = document.activeElement;
      const focusId = activeEl && activeEl.id === "findings-search" ? "findings-search" : null;
      const selStart = focusId ? activeEl.selectionStart : null;

      const root = document.getElementById("main-root");
      if (currentView === "dashboard") root.innerHTML = renderDashboard();
      else if (currentView === "findings") root.innerHTML = renderFindings();
      else if (currentView === "incidents") root.innerHTML = renderIncidentDetail();
      else if (currentView === "devices") root.innerHTML = renderDevices();
      else if (currentView === "isolations") root.innerHTML = renderIsolations();
      else root.innerHTML = renderAudit();

      if (focusId) {
        const el = document.getElementById(focusId);
        if (el) {
          el.focus();
          if (selStart !== null) el.setSelectionRange(selStart, selStart);
        }
      }
    }

    loadHealth();
    refreshAll();
    const es = new EventSource("/api/stream");
    es.onmessage = (ev) => {
      const data = JSON.parse(ev.data);
      const changed =
        JSON.stringify(state.kpis) !== JSON.stringify(data.kpis) ||
        state.incidents.length !== data.incidents.length ||
        state.isolations.length !== data.isolations.length;
      state.kpis = data.kpis;
      state.devices = data.devices;
      state.incidents = data.incidents;
      state.isolations = data.isolations;
      document.getElementById("nav-open-badge").textContent = data.kpis.open_incidents ?? 0;
      if (changed) render();
    };
  </script>
</body>
</html>
